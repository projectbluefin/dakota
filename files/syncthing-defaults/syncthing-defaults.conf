# Syncthing's config describes what this account shares and, once a peer is
# paired, which devices may read it, so it must not be readable by other
# accounts.
#
# The mode cannot come from the BuildStream element: artifacts are stored in
# CAS, which records only an executable bit, so config.xml reaches the image as
# 0644 and the state directory as 0777. The image fixes the shipped /etc/skel
# copy, which is what a new account inherits. These rules are the runtime half.
#
# Measured on Syncthing v2.1.5: `syncthing serve` leaves a config it was given
# byte-identical - it does not add an apikey - but any settings change (pairing
# a device through the GUI, `syncthing generate`) rewrites the file in place and
# keeps whatever mode it already had. So a config that ever reaches an account
# as 0644 stays 0644 through every rewrite; `z` re-asserts the mode instead.
#
# Scope is deliberately limited to the two Syncthing-owned paths. Rules for
# %h/.config, %h/.local or the XDG directories would match every existing
# account too, overwriting modes the user chose - widening a deliberately
# private ~/Documents from 0700 to 0755, for example. Those paths are fixed in
# the image instead, where they only affect accounts created from skel.
z %h/.local/state/syncthing 0700 - - -
z %h/.local/state/syncthing/config.xml 0600 - - -
