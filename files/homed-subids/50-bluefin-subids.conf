# Give systemd-homed users a subuid/subgid range before their first
# session starts (see /usr/libexec/bluefin-homed-subids). Runs as root (+)
# before every user manager, so it covers GDM, TTY and SSH logins; a
# failure (-) never blocks the login.
[Service]
ExecStartPre=-+/usr/libexec/bluefin-homed-subids %i
