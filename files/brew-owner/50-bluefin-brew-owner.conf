# Give the Homebrew prefix to the first regular user who logs in while it
# has no owner: ublue-os/brew hands it to UID 1000, which systemd-homed
# users never get (see /usr/libexec/bluefin-brew-owner). Runs as root (+)
# before every user manager, so it covers GDM, TTY and SSH logins and
# finishes before brew-preinstall starts; a failure (-) never blocks the
# login.
[Service]
ExecStartPre=-+/usr/libexec/bluefin-brew-owner claim %i
