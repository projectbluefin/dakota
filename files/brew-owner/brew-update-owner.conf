# Run as whoever owns the Homebrew prefix instead of ublue-os/brew's fixed
# User=1000, which systemd-homed users never get (see
# /usr/libexec/bluefin-brew-owner).
# SyslogIdentifier keeps brew's output tagged brew-update instead of the
# helper's name.
[Service]
User=
SyslogIdentifier=brew-update
ExecStart=
ExecStart=/usr/libexec/bluefin-brew-owner run /home/linuxbrew/.linuxbrew/bin/brew update
