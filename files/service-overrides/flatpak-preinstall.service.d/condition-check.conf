[Service]
# Probe the subcommand without installing anything. "flatpak help" is not a
# valid command and skips preinstallation even when preinstall is supported.
# Older Flatpak versions exit nonzero here, so systemd skips rather than fails
# the service. Drop this guard when all supported images provide preinstall.
ExecCondition=/bin/sh -c 'flatpak preinstall --help >/dev/null 2>&1'
