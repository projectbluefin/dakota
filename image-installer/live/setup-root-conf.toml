# bootc setup-root config for the live entry only (bootc-setup-root-conf.toml(5)).
#
# Shipped in the medium's live-only initrd (build-raw-image.sh), never in the
# image: with it, bootc-root-setup.service mounts the composefs root and the
# deployment's /etc and /var as overlays with tmpfs upper layers, so the live
# session writes to RAM and the medium stays what the installer copies. The
# composefs objects are still read straight from the medium's ext4 root, with
# fs-verity checked: the strict composefs= karg stays.
[root]
transient = true

[etc]
mount = "transient"

[var]
mount = "transient"
