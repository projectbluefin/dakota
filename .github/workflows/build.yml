name: Build Bluefin dakota

on:
  push:
    # next builds per content push too: syncs and merged junction bumps queue
    # behind testing in the shared concurrency group. queue: max keeps every
    # queued run (FIFO) instead of superseding — the stale-check job below
    # collapses burst days to one build of the newest state per branch.
    branches: [testing, next]
    paths:
      - "elements/**"
      - "plugins/**"
      - "patches/**"
      - "Justfile"
      - "project.conf"
      - "include/**"
  # Fires daily at 13:00 UTC — 5 hours after the gnome-build-meta nightly
  # (~08:00 UTC) to absorb nightly deltas before building.
  # NOTE: schedule triggers run on the default branch; set testing as the
  # default branch in repo settings for this to target testing.
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:
  # Label a same-repo PR `build` to build it; adding the label starts a run.
  pull_request:
    branches: [testing, next]
    types: [opened, synchronize, reopened, labeled]

permissions: read-all

env:
  IMAGE_NAME: dakota
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}

# queue: max holds up to 100 pending runs FIFO. The default (queue: single)
# keeps only ONE pending run per group and cancels the previous pending run
# whenever a new one arrives — so a testing push followed ~40s later by the
# sync-next push to next silently discarded the testing build (2026-08-22).
concurrency:
  group: dakota-bst-build-global
  cancel-in-progress: false
  queue: max

jobs:
  verify-default-branch:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Verify repository default branch is "testing"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          db=$(gh api "repos/${GITHUB_REPOSITORY}" --jq .default_branch)
          if [ "$db" != "testing" ]; then
            echo "::error::default branch is '$db', expected 'testing'. Daily schedule will silently target wrong branch. Fix repo settings."
            exit 1
          fi

  # With queue: max every push queues its own run instead of superseding the
  # previous pending one. A run that waited in the queue may be stale by the
  # time it starts: a newer push run for the same branch is already queued
  # and will build a superset of this state. Skip the expensive build then.
  stale-check:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'build') && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-26.04
    permissions:
      actions: read
    outputs:
      stale: ${{ steps.check.outputs.stale }}
    steps:
      - name: Check for newer queued run on this branch
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          newer=0
          # Concurrency-held runs surface as "queued" or "pending" depending
          # on where they wait; count both.
          for status in queued pending; do
            n=$(gh run list \
              --repo "${{ github.repository }}" \
              --workflow build.yml \
              --branch "$BRANCH" \
              --event "${{ github.event_name }}" \
              --status "$status" \
              --json databaseId \
              --jq "[.[] | select(.databaseId > ${{ github.run_id }})] | length")
            newer=$((newer + n))
          done
          if [ "$newer" -gt 0 ]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
            echo "${newer} newer queued run(s) for ${BRANCH} — skipping stale build"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: [verify-default-branch, stale-check]
    if: (!cancelled()) && needs.stale-check.outputs.stale != 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'build') && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-26.04
    timeout-minutes: 350
    # The BuildBox backend has four action slots. Start every image variant
    # together; the backend remains the global execution-capacity limit.
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - variant: default
            element: oci/bluefin.bst
            image_suffix: ""
            publish: true
            continue: false
          - variant: nvidia
            element: oci/bluefin-nvidia.bst
            image_suffix: "-nvidia"
            publish: true
            continue: true
          - variant: gaming
            element: oci/bluefin.bst
            image_suffix: "-gaming"
            publish: true
            continue: true
            gaming: "true"
          - variant: nvidia-gaming
            element: oci/bluefin-nvidia.bst
            image_suffix: "-nvidia-gaming"
            publish: true
            continue: true
            gaming: "true"
    continue-on-error: ${{ matrix.continue }}
    env:
      BUILD_GAMING: ${{ matrix.gaming || 'false' }}
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Capture build timestamp
        id: timestamp
        run: echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Setup runner
        uses: projectbluefin/actions/bootc-build/setup-runner@v1
        with:
          storage-backend: btrfs
          update-podman: true
          native-overlay: true
          install-tools: '["just"]'

      - name: Generate BuildStream CI config
        env:
          CASD_CLIENT_CERT: ${{ vars.CASD_CLIENT_CERT }}
          CASD_CLIENT_KEY: ${{ secrets.CASD_CLIENT_KEY }}
        uses: ./.github/actions/generate-bst-ci-config
        with:
          enable-remote-execution: "true"
          # BuildStream adds artifact/source push queues to the build when the
          # configured remotes are writable. RE and the caches share one CAS,
          # so payloads remain on the BuildBox host and are deduplicated there.
          enable-push: "true"

      - name: Count elements for progress tracking
        id: count
        env:
          BST_FLAGS: -o x86_64_v3 false --no-interactive --config /src/buildstream-ci.conf
        run: |
          set +e
          BST_SHOW_OUT=$(just bst show --deps all --format "%{name}" \
            ${{ matrix.element }} 2>&1)
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            TOTAL=$(echo "$BST_SHOW_OUT" | wc -l)
            echo "total=${TOTAL}" >> "$GITHUB_OUTPUT"
            echo "Element graph: ${TOTAL} elements"
          else
            echo "$BST_SHOW_OUT"
            echo "::warning::bst show failed (rc=${rc}) — progress will show absolute counts only"
            echo "total=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Build OCI image with BuildStream
        env:
          BST_FLAGS: -o x86_64_v3 false --no-interactive --config /src/buildstream-ci.conf
          ELEMENT_TOTAL: ${{ steps.count.outputs.total }}
        run: |
          set -o pipefail
          CONSOLE_LOG="logs/bst-console-${{ matrix.variant }}.log"
          just bst build --deps none ${{ matrix.element }} 2>&1 \
            | tee "$CONSOLE_LOG" \
            | python3 files/scripts/bst-progress.py

          # Fail closed: a green cache hit is not proof that BuildStream loaded
          # the remote executor. The startup banner is emitted whenever the
          # remote-execution block is active, even if no action needs rebuilding.
          if ! grep -Fq "Remote Execution Configuration" "$CONSOLE_LOG"; then
            echo "::error::BuildStream did not load the remote execution configuration"
            exit 1
          fi
        timeout-minutes: 330

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: buildstream-logs-x86_64-${{ matrix.variant }}
          path: logs/
          retention-days: 7
          if-no-files-found: ignore

  # PR images: export from the shared cache and push :pr-N. Never signed or
  # promoted; publish.yml ignores pull_request runs.
  pr-image:
    needs: build
    if: (!cancelled()) && needs.build.result == 'success' && (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'build') && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: default
            image_suffix: ""
          - variant: nvidia
            image_suffix: "-nvidia"
          - variant: gaming
            export_variant: default
            image_suffix: "-gaming"
            gaming: "true"
          - variant: nvidia-gaming
            export_variant: nvidia
            image_suffix: "-nvidia-gaming"
            gaming: "true"
    permissions:
      contents: read
      packages: write
    env:
      PR_TAG: pr-${{ github.event.pull_request.number }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Capture build timestamp
        id: timestamp
        run: echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Setup runner
        uses: projectbluefin/actions/bootc-build/setup-runner@v1
        with:
          storage-backend: btrfs
          update-podman: true
          native-overlay: true
          install-tools: '["just"]'

      - name: Generate BST fetch config
        env:
          CASD_CLIENT_CERT: ${{ vars.CASD_CLIENT_CERT }}
          CASD_CLIENT_KEY: ${{ secrets.CASD_CLIENT_KEY }}
        uses: ./.github/actions/generate-bst-ci-config
        with:
          enable-remote-execution: 'false'
          enable-push: 'false'

      - name: Export OCI image from BuildStream
        env:
          BST_FLAGS: -o x86_64_v3 false --no-interactive --config /src/buildstream-ci.conf
          BUILD_IMAGE_NAME: ${{ env.IMAGE_NAME }}
          BUILD_GAMING: ${{ matrix.gaming || 'false' }}
          OCI_IMAGE_CREATED: ${{ steps.timestamp.outputs.created }}
          OCI_IMAGE_REVISION: ${{ github.event.pull_request.head.sha }}
          OCI_IMAGE_VERSION: ${{ env.PR_TAG }}
        run: just export ${{ matrix.export_variant || matrix.variant }}

      - name: Chunkify image layers
        env:
          BUILD_IMAGE_NAME: ${{ env.IMAGE_NAME }}${{ matrix.image_suffix }}
        run: just chunkify "localhost/${BUILD_IMAGE_NAME}:latest"

      - name: Validate with bootc container lint
        env:
          BUILD_IMAGE_NAME: ${{ env.IMAGE_NAME }}${{ matrix.image_suffix }}
        run: just lint

      - name: Login to GHCR
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | sudo podman login ghcr.io --username "$GH_ACTOR" --password-stdin

      - name: Push :${{ env.PR_TAG }} to GHCR
        run: |
          set -euo pipefail
          LOCAL_IMAGE="${{ env.IMAGE_NAME }}${{ matrix.image_suffix }}"
          IMAGE="${{ env.IMAGE_REGISTRY }}/${LOCAL_IMAGE}"
          sudo podman tag "localhost/${LOCAL_IMAGE}:latest" "${IMAGE}:${PR_TAG}"
          for attempt in 1 2 3; do
            sudo podman push --compression-format=zstd \
              --digestfile /tmp/digest.txt "${IMAGE}:${PR_TAG}" && break
            [ "$attempt" -lt 3 ] || { echo "ERROR: push failed for ${IMAGE}:${PR_TAG}"; exit 1; }
            sleep 5
          done
          DIGEST=$(cat /tmp/digest.txt)
          echo "${IMAGE}:${PR_TAG} @ ${DIGEST}"
          echo "- \`${IMAGE}:${PR_TAG}\` \`${DIGEST}\`" >> "$GITHUB_STEP_SUMMARY"

  # Required check: pending until a `build`-labeled PR has built.
  build-gate:
    needs: [stale-check, build]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Require a green build when the PR is labeled build
        env:
          LABELED: ${{ contains(github.event.pull_request.labels.*.name, 'build') }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          STALE: ${{ needs.stale-check.outputs.stale }}
          BUILD: ${{ needs.build.result }}
        run: |
          [ "$LABELED" = "true" ] || exit 0
          [ "$SAME_REPO" = "true" ] || { echo "::error::build label needs a same-repo branch"; exit 1; }
          [ "$STALE" != "true" ] || exit 0
          [ "$BUILD" = "success" ] || { echo "::error::build result: $BUILD"; exit 1; }
