name: Build Bluefin dakota

on:
  push:
    # The next stream is paused until the next GNOME beta; add next back here
    # (and to pull_request below) when it returns. queue: max keeps every
    # queued run (FIFO) instead of superseding — the stale-check job below
    # collapses burst days to one build of the newest state.
    branches: [testing]
    paths:
      - "elements/**"
      - "plugins/**"
      - "patches/**"
      - "Justfile"
      - "project.conf"
      - "include/**"
  # No schedule: junctions are pinned, so a timed run rebuilds identical
  # inputs and republishes them under a new date. Every relevant push to
  # testing already builds; dispatch manually to rerun.
  workflow_dispatch:
  # Label a same-repo PR `build` to build it; adding the label starts a run.
  pull_request:
    branches: [testing]
    types: [opened, synchronize, reopened, labeled]

permissions: read-all

env:
  IMAGE_NAME: dakota
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}

# queue: max holds up to 100 pending runs FIFO. The default (queue: single)
# keeps only ONE pending run per group and cancels the previous pending run
# whenever a new one arrives — so a testing push followed ~40s later by the
# sync-next push to next silently discarded the testing build (2026-08-22).
concurrency:
  group: dakota-bst-build-global
  cancel-in-progress: false
  queue: max

jobs:
  # With queue: max every push queues its own run instead of superseding the
  # previous pending one. A run that waited in the queue may be stale by the
  # time it starts: a newer push run for the same branch is already queued
  # and will build a superset of this state. Skip the expensive build then.
  stale-check:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'build') && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-26.04
    permissions:
      actions: read
    outputs:
      stale: ${{ steps.check.outputs.stale }}
    steps:
      - name: Check for newer queued run on this branch
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          newer=0
          # Concurrency-held runs surface as "queued" or "pending" depending
          # on where they wait; count both.
          for status in queued pending; do
            n=$(gh run list \
              --repo "${{ github.repository }}" \
              --workflow build.yml \
              --branch "$BRANCH" \
              --event "${{ github.event_name }}" \
              --status "$status" \
              --json databaseId \
              --jq "[.[] | select(.databaseId > ${{ github.run_id }})] | length")
            newer=$((newer + n))
          done
          if [ "$newer" -gt 0 ]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
            echo "${newer} newer queued run(s) for ${BRANCH} — skipping stale build"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: [stale-check]
    if: (!cancelled()) && needs.stale-check.outputs.stale != 'true' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'build') && github.event.pull_request.head.repo.full_name == github.repository))
    # Runner pools are repo variables so switching back to GitHub-hosted
    # runners is one settings change. Only signing jobs may use the signing pool.
    runs-on: ${{ vars.DAKOTA_BUILD_RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 350
    # One job per gaming value. Each builds the default and NVIDIA images in
    # a single BuildStream session, so the shared base is scheduled once
    # instead of once per variant job. The NVIDIA image stays allowed to
    # fail: only `required` must end up built for the job to pass.
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - group: standard
            elements: oci/bluefin.bst oci/bluefin-nvidia.bst
            required: oci/bluefin.bst
            continue: false
          - group: gaming
            elements: oci/bluefin.bst oci/bluefin-nvidia.bst
            required: ""
            continue: true
            gaming: "true"
    continue-on-error: ${{ matrix.continue }}
    env:
      BUILD_GAMING: ${{ matrix.gaming || 'false' }}
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Capture build timestamp
        id: timestamp
        run: echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Setup runner
        uses: projectbluefin/actions/bootc-build/setup-runner@v1
        with:
          storage-backend: btrfs
          update-podman: true
          native-overlay: true
          install-tools: '["just"]'

      - name: Generate BuildStream CI config
        env:
          CASD_CLIENT_CERT: ${{ vars.CASD_CLIENT_CERT }}
          CASD_CLIENT_KEY: ${{ secrets.CASD_CLIENT_KEY }}
        uses: ./.github/actions/generate-bst-ci-config
        with:
          enable-remote-execution: "true"
          # BuildStream adds artifact/source push queues to the build when the
          # configured remotes are writable. RE and the caches share one CAS,
          # so payloads remain on the BuildBox host and are deduplicated there.
          enable-push: "true"

      - name: Count elements for progress tracking
        id: count
        env:
          BST_FLAGS: -o x86_64_v3 false --no-interactive --config /src/buildstream-ci.conf
        run: |
          set +e
          BST_SHOW_OUT=$(just bst show --deps all --format "%{name}" \
            ${{ matrix.elements }} 2>&1)
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            TOTAL=$(echo "$BST_SHOW_OUT" | wc -l)
            echo "total=${TOTAL}" >> "$GITHUB_OUTPUT"
            echo "Element graph: ${TOTAL} elements"
          else
            echo "$BST_SHOW_OUT"
            echo "::warning::bst show failed (rc=${rc}) — progress will show absolute counts only"
            echo "total=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Build OCI images with BuildStream
        env:
          BST_FLAGS: -o x86_64_v3 false --no-interactive --config /src/buildstream-ci.conf
          ELEMENT_TOTAL: ${{ steps.count.outputs.total }}
          REQUIRED: ${{ matrix.required }}
        run: |
          set -o pipefail
          CONSOLE_LOG="logs/bst-console-${{ matrix.group }}.log"
          # on-error: continue builds every target it can, then fails if any
          # target failed.
          status=0
          just bst build --deps none ${{ matrix.elements }} 2>&1 \
            | tee "$CONSOLE_LOG" \
            | python3 files/scripts/bst-progress.py || status=$?

          # Fail closed: a green cache hit is not proof that BuildStream loaded
          # the remote executor. The startup banner is emitted whenever the
          # remote-execution block is active, even if no action needs rebuilding.
          if ! grep -Fq "Remote Execution Configuration" "$CONSOLE_LOG"; then
            echo "::error::BuildStream did not load the remote execution configuration"
            exit 1
          fi

          if [ "$status" -ne 0 ]; then
            if [ -z "$REQUIRED" ]; then
              exit "$status"
            fi
            # A failure among the optional targets must not fail the job, so
            # rerun only the required target. It is a cache query when that
            # target already built, and a retry of its failure otherwise.
            echo "::warning::an optional target failed to build; checking ${REQUIRED}"
            just bst build --deps none "$REQUIRED"
          fi
        timeout-minutes: 330

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: buildstream-logs-x86_64-${{ matrix.group }}
          path: logs/
          retention-days: 7
          if-no-files-found: ignore

  # PR images: export from the shared cache, sign the boot chain, and push
  # :pr-N. Never promoted; publish.yml ignores pull_request runs.
  pr-image:
    needs: build
    if: (!cancelled()) && needs.build.result == 'success' && (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'build') && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ${{ vars.DAKOTA_SIGN_RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 120
    # One job per gaming value, signing and pushing a base and an NVIDIA
    # image from one BuildStream session, the way publish-image does. Every
    # image is attempted; the job fails if any of them did not push.
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: standard
            gaming: "false"
            base_image_suffix: ""
            nvidia_image_suffix: "-nvidia"
          - group: gaming
            gaming: "true"
            base_image_suffix: "-gaming"
            nvidia_image_suffix: "-nvidia-gaming"
    permissions:
      contents: read
      packages: write
    env:
      PR_TAG: pr-${{ github.event.pull_request.number }}
      BUILD_GAMING: ${{ matrix.gaming }}
      BASE_SUFFIX: ${{ matrix.base_image_suffix }}
      NVIDIA_SUFFIX: ${{ matrix.nvidia_image_suffix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Capture build timestamp
        id: timestamp
        run: echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Setup runner
        uses: projectbluefin/actions/bootc-build/setup-runner@v1
        with:
          storage-backend: btrfs
          update-podman: true
          native-overlay: true
          install-tools: '["just"]'

      - name: Generate BST fetch config
        env:
          CASD_CLIENT_CERT: ${{ vars.CASD_CLIENT_CERT }}
          CASD_CLIENT_KEY: ${{ secrets.CASD_CLIENT_KEY }}
        uses: ./.github/actions/generate-bst-ci-config
        with:
          enable-remote-execution: 'false'
          enable-push: 'false'

      # PR images are Secure Boot signed so testers keep Secure Boot on.
      # Only same-repo branches with the build label reach this job. The key
      # is a BuildStream local source, so this pass must stay local and
      # push-free like publish's: the fetch config above disables remote
      # execution and pushes. Never sign in the build job, which pushes.
      - name: Write Secure Boot signing key
        env:
          DAKOTA_SECURE_BOOT_KEY: ${{ secrets.DAKOTA_SECURE_BOOT_KEY }}
        run: |
          if [ -z "$DAKOTA_SECURE_BOOT_KEY" ]; then
            echo "::error::DAKOTA_SECURE_BOOT_KEY is not configured"
            exit 1
          fi
          umask 077
          printf '%s\n' "$DAKOTA_SECURE_BOOT_KEY" > files/boot-keys/private/secure-boot.key

      # A failed session still leaves whatever it finished in the local
      # cache; images that never built fail their export below.
      - name: Sign boot chain and compose images
        env:
          BST_FLAGS: -o x86_64_v3 false --no-interactive --config /src/buildstream-ci.conf
          BUILD_SECURE_BOOT_SIGNING: 'true'
        run: |
          just bst build oci/bluefin.bst oci/bluefin-nvidia.bst || \
            echo "::warning::signing pass failed; exporting whatever built"

      # The key stays until export: the signed elements' cache keys include
      # it, so checkout cannot find their artifacts without it. Exports share
      # .build-out, so they run one at a time.
      - name: Export OCI images from BuildStream
        id: export
        env:
          BST_FLAGS: -o x86_64_v3 false --no-interactive --config /src/buildstream-ci.conf
          BUILD_IMAGE_NAME: ${{ env.IMAGE_NAME }}
          BUILD_SECURE_BOOT_SIGNING: 'true'
          OCI_IMAGE_CREATED: ${{ steps.timestamp.outputs.created }}
          OCI_IMAGE_REVISION: ${{ github.event.pull_request.head.sha }}
          OCI_IMAGE_VERSION: ${{ env.PR_TAG }}
        run: |
          slots=""
          for slot in base nvidia; do
            source=default; [ "$slot" = base ] || source=nvidia
            if just export "$source"; then
              slots="$slots $slot"
            else
              echo "::error::export failed for the $slot image"
            fi
          done
          echo "slots=${slots# }" >> "$GITHUB_OUTPUT"

      - name: Remove Secure Boot signing key
        if: always()
        run: rm -f files/boot-keys/private/secure-boot.key

      # Both images are exported, so BuildStream's local cache (both images'
      # artifacts, tens of GB) is no longer needed. Two images per job do not
      # fit on one runner disk alongside chunkify otherwise.
      - name: Free the BuildStream cache
        run: sudo rm -rf "${HOME}/.cache/buildstream"

      - name: Chunkify and lint images
        id: verify
        env:
          SLOTS: ${{ steps.export.outputs.slots }}
        run: |
          image_of() { if [ "$1" = base ]; then echo "$IMAGE_NAME$BASE_SUFFIX"; else echo "$IMAGE_NAME$NVIDIA_SUFFIX"; fi; }
          declare -A pids
          for slot in $SLOTS; do
            just chunkify "localhost/$(image_of "$slot"):latest" > "${RUNNER_TEMP}/chunkify-${slot}.log" 2>&1 &
            pids[$slot]=$!
          done
          declare -A chunk_status
          for slot in $SLOTS; do
            chunk_status[$slot]=0
            wait "${pids[$slot]}" || chunk_status[$slot]=$?
          done
          # Prune only after both runs finish: a run's freshly imported image
          # is untagged until it retags it. This drops the pre-chunk images
          # that the retags leave dangling.
          sudo podman image prune -f >/dev/null || true
          passed=""
          for slot in $SLOTS; do
            status=${chunk_status[$slot]}
            echo "::group::chunkify $(image_of "$slot")"
            cat "${RUNNER_TEMP}/chunkify-${slot}.log"
            echo "::endgroup::"
            if [ "$status" -ne 0 ]; then echo "::error::chunkify failed for $(image_of "$slot")"; continue; fi
            if ! BUILD_IMAGE_NAME="$(image_of "$slot")" just lint; then
              echo "::error::bootc container lint failed for $(image_of "$slot")"
              continue
            fi
            passed="$passed $slot"
          done
          echo "slots=${passed# }" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        if: steps.verify.outputs.slots != ''
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | sudo podman login ghcr.io --username "$GH_ACTOR" --password-stdin

      - name: Push :${{ env.PR_TAG }} to GHCR
        id: push
        if: steps.verify.outputs.slots != ''
        env:
          SLOTS: ${{ steps.verify.outputs.slots }}
        run: |
          set -euo pipefail
          pushed=0
          for slot in $SLOTS; do
            LOCAL_IMAGE="$IMAGE_NAME$BASE_SUFFIX"; [ "$slot" = base ] || LOCAL_IMAGE="$IMAGE_NAME$NVIDIA_SUFFIX"
            IMAGE="${{ env.IMAGE_REGISTRY }}/${LOCAL_IMAGE}"
            sudo podman tag "localhost/${LOCAL_IMAGE}:latest" "${IMAGE}:${PR_TAG}"
            ok=false
            for _ in 1 2 3; do
              sudo podman push --compression-format=zstd \
                --digestfile "${RUNNER_TEMP}/digest-${slot}.txt" "${IMAGE}:${PR_TAG}" && { ok=true; break; }
              sleep 5
            done
            if ! $ok; then echo "::error::push failed for ${IMAGE}:${PR_TAG}"; continue; fi
            DIGEST=$(cat "${RUNNER_TEMP}/digest-${slot}.txt")
            echo "${IMAGE}:${PR_TAG} @ ${DIGEST}"
            echo "- \`${IMAGE}:${PR_TAG}\` \`${DIGEST}\`" >> "$GITHUB_STEP_SUMMARY"
            pushed=$((pushed + 1))
          done
          echo "pushed=$pushed" >> "$GITHUB_OUTPUT"

      - name: Require both images
        if: always()
        env:
          PUSHED: ${{ steps.push.outputs.pushed }}
        run: |
          if [ "${PUSHED:-0}" -ne 2 ]; then
            echo "::error::only ${PUSHED:-0} of 2 images were pushed as :${PR_TAG}"
            exit 1
          fi

  # Required check: pending until a `build`-labeled PR has built.
  build-gate:
    needs: [stale-check, build]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Require a green build when the PR is labeled build
        env:
          LABELED: ${{ contains(github.event.pull_request.labels.*.name, 'build') }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          STALE: ${{ needs.stale-check.outputs.stale }}
          BUILD: ${{ needs.build.result }}
        run: |
          [ "$LABELED" = "true" ] || exit 0
          [ "$SAME_REPO" = "true" ] || { echo "::error::build label needs a same-repo branch"; exit 1; }
          [ "$STALE" != "true" ] || exit 0
          [ "$BUILD" = "success" ] || { echo "::error::build result: $BUILD"; exit 1; }
