name: Release Reminder

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  reminder:
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: projectbluefin/actions/.github/workflows/reusable-release-reminder.yml@1ca13a7cb0645b9dae56df739b856291b5f39853 # v1
    with:
      days_warn: 7
      days_escalate: 14
    secrets: inherit
