name: Release Reminder

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  reminder:
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: projectbluefin/actions/.github/workflows/reusable-release-reminder.yml@7827453a52eaddb45cb432bd14d9651bc27669ba # v1
    with:
      days_warn: 7
      days_escalate: 14
    secrets: inherit
