name: Release Reminder

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  reminder:
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: projectbluefin/actions/.github/workflows/reusable-release-reminder.yml@99d867d662ab64a1f82b4f5f24f73b4051dbff01 # v1
    with:
      days_warn: 7
      days_escalate: 14
    secrets: inherit
