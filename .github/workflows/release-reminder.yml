name: Release Reminder

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  reminder:
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: projectbluefin/actions/.github/workflows/reusable-release-reminder.yml@2e8139cf6abc3663aa39e358dc43492bd9fe48d5 # v1
    with:
      days_warn: 7
      days_escalate: 14
    secrets: inherit
