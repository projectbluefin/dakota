name: Execute Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  id-token: write
  issues: write
  packages: write
  pull-requests: write

jobs:
  check-trigger:
    runs-on: ubuntu-latest
    outputs:
      is-promotion: ${{ steps.check.outputs.is-promotion }}
    steps:
      - id: check
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "is-promotion=true" >> "$GITHUB_OUTPUT"
          elif echo "$COMMIT_MSG" | grep -qE "^ci\(promote\): dakota testing|^chore: promote testing to main"; then
            echo "is-promotion=true" >> "$GITHUB_OUTPUT"
          else
            echo "is-promotion=false" >> "$GITHUB_OUTPUT"
          fi

  execute:
    needs: [check-trigger]
    if: needs.check-trigger.outputs.is-promotion == 'true'
    permissions:
      actions: read
      contents: write
      issues: write
      packages: write
      pull-requests: write
    uses: projectbluefin/actions/.github/workflows/reusable-execute-release.yml@7827453a52eaddb45cb432bd14d9651bc27669ba # v1
    with:
      registry: ghcr.io/projectbluefin
      variants: >-
        [
          {"image":"dakota","source_tag":"testing","target_tag":"stable"},
          {"image":"dakota-nvidia","source_tag":"testing","target_tag":"stable"}
        ]
      cosign_identity_regexp: ^https://github\.com/projectbluefin/(dakota|actions)/\.github/workflows/
    secrets: inherit

  release-notes:
    needs: [execute]
    if: always() && needs.execute.result == 'success'
    permissions:
      actions: read
      contents: write
      id-token: write
      packages: read
    uses: projectbluefin/actions/.github/workflows/reusable-release.yml@7827453a52eaddb45cb432bd14d9651bc27669ba # v1
    with:
      stream_name: stable
      image: ghcr.io/projectbluefin/dakota
      # Use the BST-native SBOM from publish.yml's publish-sbom job.
      # Inline syft with rpm cataloger returns 0 packages on BST images.
      build_workflow: publish.yml
      build_branch: main
      sbom_artifact: sbom-dakota
      checkout_ref: main
      project_name: Dakota
      badge_label: Stable
      accent_color: "#0ea5e9"
      cert_identity_regexp: >-
        ^https://github\.com/projectbluefin/(dakota|actions)/\.github/workflows/
      notable_packages: >-
        [
          {"sbom_name": "linux",       "label": "Kernel"},
          {"sbom_name": "gnome-shell", "label": "GNOME Shell"},
          {"sbom_name": "flatpak",     "label": "Flatpak"},
          {"sbom_name": "bootc",       "label": "bootc"}
        ]
      docs_url: https://docs.projectbluefin.io/changelogs
    secrets: inherit

  post-release-variants:
    needs: [execute, release-notes]
    if: always() && needs.release-notes.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Resolve promoted digests
        id: digests
        run: |
          set -euo pipefail
          for image in dakota dakota-nvidia; do
            digest=$(skopeo inspect --no-tags "docker://ghcr.io/projectbluefin/${image}:stable" \
              | jq -r '.Digest' | cut -c1-19)
            echo "${image}=${digest}" >> "$GITHUB_OUTPUT"
          done

      - name: Prepend variants table to release
        env:
          DAKOTA_DIGEST: ${{ steps.digests.outputs.dakota }}
          NVIDIA_DIGEST: ${{ steps.digests.outputs.dakota-nvidia }}
        run: |
          set -euo pipefail
          TAG=$(gh release list --repo "${{ github.repository }}" --limit 1 --json tagName --jq '.[0].tagName')
          CURRENT=$(gh release view "$TAG" --repo "${{ github.repository }}" --json body --jq '.body')

          VARIANTS_SECTION=$(printf '%s\n' \
            '## Variants promoted' \
            '' \
            '| Variant | Tag | Digest |' \
            '|---|---|---|' \
            "| \`dakota\` | \`:stable\` | \`${DAKOTA_DIGEST}\` |" \
            "| \`dakota-nvidia\` | \`:stable\` | \`${NVIDIA_DIGEST}\` |" \
            '' \
            '---' \
            '')
          printf '%s\n%s' "$VARIANTS_SECTION" "$CURRENT" > /tmp/updated-body.md
          gh release edit "$TAG" --repo "${{ github.repository }}" --notes-file /tmp/updated-body.md
