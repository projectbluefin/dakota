name: PR Release Gate

on:
  pull_request:
    branches:
      - main

permissions:
  actions: read
  contents: read
  issues: write
  packages: read
  pull-requests: write

jobs:
  gate:
    if: github.event.pull_request.head.ref == 'auto/promote-testing-to-main'
    uses: projectbluefin/actions/.github/workflows/reusable-release-gate.yml@7827453a52eaddb45cb432bd14d9651bc27669ba # v1
    with:
      repo: ${{ github.repository }}
      registry: ghcr.io/projectbluefin
      variants: >-
        [{"image":"dakota"},{"image":"dakota-nvidia"}]
      cosign_identity_regexp: ^https://github\.com/projectbluefin/(dakota|actions)/\.github/workflows/
      target_tag: testing
      run_e2e: false
    secrets: inherit
