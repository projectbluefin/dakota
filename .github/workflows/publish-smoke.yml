name: Publish Smoke

# Observational smoke must live in a separate workflow. A reusable-workflow call
# job cannot be marked continue-on-error, so keeping smoke inside publish.yml
# turns flaky desktop assertions into a red publish pipeline.
on:
  workflow_run:
    workflows: ["Publish Bluefin dakota"]
    types: [completed]
    branches:
      - main
      - 'gh-readonly-queue/main/**'
      - next
      - 'gh-readonly-queue/next/**'
      - testing
      - 'gh-readonly-queue/testing/**'

permissions:
  contents: read
  packages: write

jobs:
  wait-for-images:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: read
      actions: read
    outputs:
      build_sha: ${{ steps.build-sha.outputs.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # This workflow is the second hop of a workflow_run chain
      # (Build -> Publish -> Smoke). Publish reads the built commit from its
      # own workflow_run.head_sha (the Build run), but by the time it reaches
      # us, github.event.workflow_run.head_sha is the *Publish* run's head,
      # which for a workflow_run-triggered run is the default branch tip at
      # trigger time -- not the commit that was built. The two only coincide
      # for a testing push that nothing has moved past; every next-stream
      # build (and any testing push that lands while Publish is running)
      # makes us ask GHCR for a :SHA tag that was never pushed (#1305).
      #
      # Publish records the SHA it actually published in the digest artifact,
      # so read it from there and use it for both the verification below and
      # the smoke image reference.
      - name: Download publish digest metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: digest-default
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/publish-meta

      - name: Read the SHA Publish built
        id: build-sha
        env:
          META: ${{ runner.temp }}/publish-meta/digest.json
          EVENT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          SHA=$(jq -r '.sha // empty' "$META")
          if ! [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "ERROR: digest-default from run ${{ github.event.workflow_run.id }} has no usable .sha (got '${SHA}')"
            exit 1
          fi
          if [ "$SHA" != "$EVENT_SHA" ]; then
            echo "::notice::Publish built ${SHA}; workflow_run.head_sha is ${EVENT_SHA} (default branch tip). Using the built SHA."
          fi
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

      - name: Verify dakota image
        uses: ./.github/actions/resolve-image-digest
        with:
          artifact-name: digest-default
          image: ghcr.io/${{ github.repository_owner }}/dakota
          build-sha: ${{ steps.build-sha.outputs.sha }}
          registry-creds: ${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          verify: 'true'

      - name: Verify dakota-nvidia image
        uses: ./.github/actions/resolve-image-digest
        with:
          artifact-name: digest-nvidia
          image: ghcr.io/${{ github.repository_owner }}/dakota-nvidia
          build-sha: ${{ steps.build-sha.outputs.sha }}
          registry-creds: ${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          verify: 'true'

  smoke:
    needs: wait-for-images
    if: github.event.workflow_run.conclusion == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: dakota
          - image: dakota-nvidia
    uses: ./.github/workflows/run-testsuite.yml
    with:
      image: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ needs.wait-for-images.outputs.build_sha }}
      suites: smoke
    secrets: inherit
