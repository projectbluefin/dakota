# Prow: /commands on issues and pull requests, needs-kind, reviewers and approvers from
# OWNERS, merging through the merge queue on lgtm + approved, and labels from the org config
# at projectbluefin/.project/prow.yaml.
# Upstream template: cncf/prow-github-actions v3.0.1 templates/workflow-templates/prow.yml.
# Deviations from the template (projectbluefin Actions security baseline):
#   - permissions: {} at the top, write scopes granted per job
#   - reusable workflow pinned to the v3.0.1 commit SHA
#   - prow-commands limited to the commands whose labels exist in the org config
#   - triage/priority and generic label commands require the canonical YAML roster
# Docs: https://github.com/cncf/prow-github-actions/blob/v3.0.1/docs/installing.md
name: Prow
on:
  issues:
    types: [opened, reopened, labeled, unlabeled]
  issue_comment:
    types: [created]
  # pull_request_target, not pull_request: fork pull requests get a write token, so they can be
  # labeled and merged too. This is safe because nothing here checks out or runs pull request
  # code; the reusable workflow only checks out cncf/prow-github-actions itself.
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled]
  pull_request_review:
    types: [submitted, dismissed]
  check_suite:
    types: [completed]
  # backstop for merges missed by the events above
  schedule:
    - cron: '0 * * * *'
  # label-sync: run by hand after installing and after every change to the org config
  workflow_dispatch:
  push:
    branches: [testing]
    paths: [.github/prow.yaml]

permissions: {}

# One run per comment (commands are never collapsed); per event+action for everything else,
# so a pending `synchronize` run can only be superseded by a newer `synchronize` run.
# Never cancel a run that may be merging.
concurrency:
  group: prow-${{ github.event_name }}-${{ github.event.action }}-${{ github.event.comment.id || github.event.pull_request.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  authorize:
    if: github.event_name == 'issue_comment'
    permissions:
      contents: read
    uses: projectbluefin/.project/.github/workflows/prow-authorize.yml@ce7a3d4f3c0ef7a0b371cd73d8131291abe58051

  prow:
    needs: authorize
    # Explicit status check keeps non-comment events running when authorize is skipped.
    # A failed roster lookup blocks execution rather than granting public triage access.
    if: ${{ !cancelled() && (needs.authorize.result == 'success' || needs.authorize.result == 'skipped') && github.event_name != 'workflow_dispatch' && github.event_name != 'push' }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
      statuses: write
      actions: write
    uses: cncf/prow-github-actions/.github/workflows/prow.yml@187c5e3cd95a329c43448e1bdb3b1f5249232e44 # v3.0.1
    with:
      # Aliases inherit their base command: /remove-triage and /remove-priority are gated too.
      # Keep generic /label gated so a verbatim allowlist cannot bypass the restriction.
      prow-commands: /kind /area /hold /lgtm /approve /assign /unassign /cc /uncc /close /reopen /retest /test /ok-to-test /help /good-first-issue /check-required-labels ${{ needs.authorize.outputs.triage == 'true' && '/triage /priority /label' || '' }}

  label-sync:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    permissions:
      contents: write
      issues: write
      pull-requests: write
      statuses: write
      actions: write
    uses: cncf/prow-github-actions/.github/workflows/prow.yml@187c5e3cd95a329c43448e1bdb3b1f5249232e44 # v3.0.1
    with:
      jobs: label-sync
