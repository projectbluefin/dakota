name: Publish Bluefin dakota

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Existing BuildStream artifact SHA to republish (recovery only)'
        required: false
        type: string
        default: ''
  workflow_run:
    workflows: ["Build Bluefin dakota"]
    types: [completed]
    branches:
      - next
      - 'gh-readonly-queue/next/**'
      - testing
      - 'gh-readonly-queue/testing/**'

env:
  IMAGE_NAME: dakota
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write
  actions: read

concurrency:
  # Separate publish queues per branch so next and testing don't collide.
  group: publish-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  # ── Resolve context ───────────────────────────────────────────────────────
  # Single source of truth for SHA and trigger event, shared by all downstream jobs.
  setup:
    runs-on: ubuntu-26.04
    outputs:
      sha: ${{ steps.context.outputs.sha }}
      event: ${{ steps.context.outputs.event }}
      branch: ${{ steps.context.outputs.branch }}
      testing_tag: ${{ steps.context.outputs.testing_tag }}
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event != 'pull_request' &&
       (github.event.workflow_run.head_branch == 'next' ||
        startsWith(github.event.workflow_run.head_branch, 'gh-readonly-queue/next/') ||
        github.event.workflow_run.head_branch == 'testing' ||
        startsWith(github.event.workflow_run.head_branch, 'gh-readonly-queue/testing/')))
    steps:
      - name: Resolve build SHA and trigger event
        id: context
        run: |
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
            echo "event=${{ github.event.workflow_run.event }}" >> "$GITHUB_OUTPUT"
            BRANCH="${{ github.event.workflow_run.head_branch }}"
          elif [[ -n "${{ inputs.source_sha }}" ]]; then
            echo "sha=${{ inputs.source_sha }}" >> "$GITHUB_OUTPUT"
            echo "event=${{ github.event_name }}" >> "$GITHUB_OUTPUT"
            BRANCH="${{ github.ref_name }}"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "event=${{ github.event_name }}" >> "$GITHUB_OUTPUT"
            BRANCH="${{ github.ref_name }}"
          fi
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
          # Derive the :testing tag from the branch name.
          # Only trunk branches (direct pushes / dispatch) advance stream tags.
          # Merge-queue builds (gh-readonly-queue/**) publish an immutable :SHA
          # tag only — they must NOT move public stream tags before the commit lands.
          # testing  → :testing  (published on every testing build)
          # next     → :next     (rolling GNOME master / bleeding edge)
          # queue/** → (empty)   :SHA only, no stream tag
          if [[ "$BRANCH" == "next" ]]; then
            echo "testing_tag=next" >> "$GITHUB_OUTPUT"
          elif [[ "$BRANCH" == "testing" ]]; then
            echo "testing_tag=testing" >> "$GITHUB_OUTPUT"
          else
            # merge-queue or other refs: publish :SHA tag only, do NOT move stream tags
            echo "testing_tag=" >> "$GITHUB_OUTPUT"
          fi

  # ── Export, sign, attest ─────────────────────────────────────────────────
  # Pulls the base images from remote CAS, signs the boot layer locally,
  # pushes :$sha, signs and attests.
  # SBOM generation is split to a separate job (publish-sbom) so it runs
  # in parallel with promote rather than blocking it.
  publish-image:
    needs: setup
    runs-on: ${{ vars.DAKOTA_SIGN_RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 180
    # One job per gaming value, each publishing a base and an NVIDIA image.
    # BuildStream signs both in one session, so the boot set they share (the
    # signed kernel, modules and initramfs) is built once. The default image
    # is required; every other image may fail without blocking it, and the
    # gaming job as a whole is continue-on-error.
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: standard
            gaming: 'false'
            continue: false
            base_variant: default
            base_image_suffix: ''
            base_continue: false
            nvidia_variant: nvidia
            nvidia_image_suffix: '-nvidia'
            nvidia_continue: true
          - group: gaming
            gaming: 'true'
            continue: true
            base_variant: gaming
            base_image_suffix: '-gaming'
            base_continue: true
            nvidia_variant: nvidia-gaming
            nvidia_image_suffix: '-nvidia-gaming'
            nvidia_continue: true
    continue-on-error: ${{ matrix.continue }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
      actions: read
    # Image names are IMAGE_NAME plus these suffixes; the env context is not
    # available at job level, so steps join them.
    env:
      BUILD_GAMING: ${{ matrix.gaming }}
      BASE_SUFFIX: ${{ matrix.base_image_suffix }}
      NVIDIA_SUFFIX: ${{ matrix.nvidia_image_suffix }}
      BASE_CONTINUE: ${{ matrix.base_continue }}
      NVIDIA_CONTINUE: ${{ matrix.nvidia_continue }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.setup.outputs.sha }}

      # The gaming build job may fail without failing the build run, which
      # still triggers this workflow. Publishing would then rebuild whatever
      # is missing from the cache here, without remote execution, and drop
      # the images on timeout; stop instead and let verify-promotion report it.
      - name: Require this group's CI build
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          GROUP: ${{ matrix.group }}
        run: |
          set -euo pipefail
          conclusion=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=100" \
            | jq -r --arg prefix "build (${GROUP}," \
              '[.jobs[] | select(.name | startswith($prefix)) | .conclusion]
               | if length == 1 then .[0] else "missing" end')
          if [ "$conclusion" != success ]; then
            echo "::error::the ${GROUP} build in run ${RUN_ID} concluded '${conclusion}'; not publishing its images"
            exit 1
          fi

      - name: Capture build timestamp
        id: timestamp
        run: echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # Use the runner's Podman stack with native rootful overlay storage.
      # FUSE-backed storage below chunkify's kernel overlay can return ESTALE.
      # Hosted runners need the disk cleanup and the BTRFS loopback; the
      # ephemeral VM pools are sized for the job, so skip both there.
      - name: Setup runner
        uses: projectbluefin/actions/bootc-build/setup-runner@v1
        with:
          storage-backend: ${{ vars.DAKOTA_SIGN_RUNNER && 'none' || 'btrfs' }}
          update-podman: true
          native-overlay: true
          install-tools: '["just"]'

      # Read-only BST config: pull from remote CAS, build locally, never push
      - name: Generate BST fetch config
        env:
          CASD_CLIENT_CERT: ${{ vars.CASD_CLIENT_CERT }}
          CASD_CLIENT_KEY: ${{ secrets.CASD_CLIENT_KEY }}
        uses: ./.github/actions/generate-bst-ci-config
        with:
          enable-remote-execution: 'false'
          enable-push: 'false'

      # Secure Boot signing happens here and in build.yml's pr-image job,
      # never in a job that pushes to the CAS. The key is a
      # BuildStream local source, so this pass must stay local and push-free,
      # which the fetch-only config above guarantees. Everything except the
      # boot layer and the final OCI elements comes from the cache.
      - name: Write Secure Boot signing key
        env:
          DAKOTA_SECURE_BOOT_KEY: ${{ secrets.DAKOTA_SECURE_BOOT_KEY }}
        run: |
          if [ -z "$DAKOTA_SECURE_BOOT_KEY" ]; then
            echo "::error::DAKOTA_SECURE_BOOT_KEY is not configured"
            exit 1
          fi
          umask 077
          printf '%s\n' "$DAKOTA_SECURE_BOOT_KEY" > files/boot-keys/private/secure-boot.key

      # If the session fails, retry the base image alone: a quick cache check
      # when it already built, a real retry when the NVIDIA failure stopped
      # it. Images that never built fail their export below.
      - name: Sign boot chain and compose images
        env:
          BST_FLAGS: --no-interactive --config /src/buildstream-ci.conf
          BUILD_SECURE_BOOT_SIGNING: 'true'
        run: |
          status=0
          just bst build oci/bluefin.bst oci/bluefin-nvidia.bst || status=$?
          if [ "$status" -ne 0 ]; then
            echo "::warning::signing pass failed (exit $status); retrying the base image alone"
            if ! just bst build oci/bluefin.bst && [ "$BASE_CONTINUE" != true ]; then
              exit 1
            fi
          fi

      # The key stays until export: the signed elements' cache keys include
      # it, so checkout cannot find their artifacts without it. Exports share
      # .build-out, so they run one at a time.
      - name: Export OCI images from BuildStream
        id: export
        env:
          BST_FLAGS: --no-interactive --config /src/buildstream-ci.conf
          BUILD_IMAGE_NAME: ${{ env.IMAGE_NAME }}
          BUILD_SECURE_BOOT_SIGNING: 'true'
          OCI_IMAGE_CREATED: ${{ steps.timestamp.outputs.created }}
          OCI_IMAGE_REVISION: ${{ needs.setup.outputs.sha }}
        run: |
          slots=""
          for slot in base nvidia; do
            if [ "$slot" = base ]; then source=default optional=$BASE_CONTINUE image=$IMAGE_NAME$BASE_SUFFIX
            else source=nvidia optional=$NVIDIA_CONTINUE image=$IMAGE_NAME$NVIDIA_SUFFIX; fi
            if just export "$source"; then
              slots="$slots $slot"
            elif [ "$optional" = true ]; then
              echo "::warning::export failed for $image; it will not be published"
            else
              echo "::error::export failed for $image"
              exit 1
            fi
          done
          echo "slots=${slots# }" >> "$GITHUB_OUTPUT"

      - name: Remove Secure Boot signing key
        if: always()
        run: rm -f files/boot-keys/private/secure-boot.key

      # Both images are exported, so BuildStream's local cache (both images'
      # artifacts, tens of GB) is no longer needed. Two images per job do not
      # fit on one runner disk alongside chunkify otherwise.
      - name: Free the BuildStream cache
        run: sudo rm -rf "${HOME}/.cache/buildstream"

      # Chunkify runs both images in parallel (each run has its own scratch
      # directories), so a runner needs about 95 GB free at the peak. It uses
      # the repository's compiled fakecap helper: the shared chunka action
      # injects nearly one million manifest entries through Python, which
      # takes hours for Dakota's 8–9 GiB images.
      - name: Chunkify, lint and audit images
        id: verify
        env:
          SLOTS: ${{ steps.export.outputs.slots }}
        run: |
          image_of() { if [ "$1" = base ]; then echo "$IMAGE_NAME$BASE_SUFFIX"; else echo "$IMAGE_NAME$NVIDIA_SUFFIX"; fi; }
          optional_of() { if [ "$1" = base ]; then echo "$BASE_CONTINUE"; else echo "$NVIDIA_CONTINUE"; fi; }
          drop() {
            if [ "$(optional_of "$1")" = true ]; then
              echo "::warning::$2 failed for $(image_of "$1"); it will not be published"
            else
              echo "::error::$2 failed for $(image_of "$1")"
              exit 1
            fi
          }
          declare -A pids
          for slot in $SLOTS; do
            just chunkify "localhost/$(image_of "$slot"):latest" > "${RUNNER_TEMP}/chunkify-${slot}.log" 2>&1 &
            pids[$slot]=$!
          done
          declare -A chunk_status
          for slot in $SLOTS; do
            chunk_status[$slot]=0
            wait "${pids[$slot]}" || chunk_status[$slot]=$?
          done
          # Prune only after both runs finish: a run's freshly imported image
          # is untagged until it retags it. This drops the pre-chunk images
          # that the retags leave dangling.
          sudo podman image prune -f >/dev/null || true
          passed=""
          for slot in $SLOTS; do
            status=${chunk_status[$slot]}
            echo "::group::chunkify $(image_of "$slot")"
            cat "${RUNNER_TEMP}/chunkify-${slot}.log"
            echo "::endgroup::"
            if [ "$status" -ne 0 ]; then drop "$slot" chunkify; continue; fi
            failed=""
            for check in lint swap-audit avatar-audit; do
              BUILD_IMAGE_NAME="$(image_of "$slot")" just "$check" || { failed=$check; break; }
            done
            if [ -n "$failed" ]; then drop "$slot" "$failed"; continue; fi
            passed="$passed $slot"
          done
          echo "slots=${passed# }" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | sudo podman login ghcr.io --username "$GH_ACTOR" --password-stdin
          mkdir -p ~/.docker
          echo "$GH_TOKEN" | podman login ghcr.io --username "$GH_ACTOR" --password-stdin \
            --compat-auth-file ~/.docker/config.json

      - name: Push :${{ needs.setup.outputs.sha }} to GHCR
        id: push
        env:
          BUILD_SHA: ${{ needs.setup.outputs.sha }}
          SLOTS: ${{ steps.verify.outputs.slots }}
        run: |
          push_slot() {
            local slot="$1" local_image image digest attempt
            if [ "$slot" = base ]; then local_image=$IMAGE_NAME$BASE_SUFFIX; else local_image=$IMAGE_NAME$NVIDIA_SUFFIX; fi
            image="${{ env.IMAGE_REGISTRY }}/${local_image}"
            sudo podman tag "localhost/${local_image}:latest" "${image}:${BUILD_SHA}"
            for attempt in 1 2 3; do
              sudo podman push --compression-format=zstd \
                --digestfile "${RUNNER_TEMP}/digest-${slot}.txt" \
                "${image}:${BUILD_SHA}" && break
              echo "Push attempt ${attempt} failed for ${image}:${BUILD_SHA}"
              [ "$attempt" -lt 3 ] || return 1
              sleep 5
            done
            digest=$(cat "${RUNNER_TEMP}/digest-${slot}.txt")
            if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "ERROR: malformed digest for ${image}: '${digest}'"
              return 1
            fi
            echo "${slot}_digest=${digest}" >> "$GITHUB_OUTPUT"
          }
          declare -A pids
          for slot in $SLOTS; do
            push_slot "$slot" > "${RUNNER_TEMP}/push-${slot}.log" 2>&1 &
            pids[$slot]=$!
          done
          for slot in $SLOTS; do
            status=0
            wait "${pids[$slot]}" || status=$?
            cat "${RUNNER_TEMP}/push-${slot}.log"
            if [ "$status" -ne 0 ]; then
              optional=$NVIDIA_CONTINUE; [ "$slot" = base ] && optional=$BASE_CONTINUE
              if [ "$optional" = true ]; then
                echo "::warning::push failed for the $slot image; it will not be published"
              else
                echo "::error::push failed for the $slot image"
                exit 1
              fi
            fi
          done

      - name: Install oras
        if: steps.push.outputs.base_digest != '' || steps.push.outputs.nvidia_digest != ''
        uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3

      # Sign, then upload the digest artifact, one image at a time: an
      # artifact means pushed AND signed, and a failed optional image must
      # not keep the other from promotion.
      # generate-sbom: false — dakota uses just sbom (BST-native provenance via
      # bst artifact list). Syft post-build scan is less accurate for BST builds.
      # SBOM attachment and SBOM signing are handled in the publish-sbom job.
      - name: Sign ${{ matrix.base_variant }} image and create attestation
        id: sign-base
        if: steps.push.outputs.base_digest != ''
        continue-on-error: ${{ matrix.base_continue }}
        uses: projectbluefin/actions/bootc-build/sign-and-publish@v1
        with:
          image: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}${{ matrix.base_image_suffix }}
          digest: ${{ steps.push.outputs.base_digest }}
          generate-sbom: false
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Write ${{ matrix.base_variant }} digest artifact
        if: steps.sign-base.outcome == 'success'
        env:
          BUILD_SHA: ${{ needs.setup.outputs.sha }}
          VARIANT: ${{ matrix.base_variant }}
          IMAGE: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}${{ matrix.base_image_suffix }}
          DIGEST: ${{ steps.push.outputs.base_digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digest-base"
          jq -n --arg variant "$VARIANT" --arg image "$IMAGE" --arg sha "$BUILD_SHA" \
            --arg digest "$DIGEST" --arg created "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{schema: 1, variant: $variant, image: $image, sha: $sha, digest: $digest, created: $created}' \
            > "${RUNNER_TEMP}/digest-base/digest.json"

      - name: Upload ${{ matrix.base_variant }} digest artifact
        if: steps.sign-base.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.base_variant }}
          path: ${{ runner.temp }}/digest-base/digest.json
          retention-days: 30
          if-no-files-found: error

      - name: Sign ${{ matrix.nvidia_variant }} image and create attestation
        id: sign-nvidia
        if: (!cancelled()) && steps.push.outputs.nvidia_digest != ''
        continue-on-error: ${{ matrix.nvidia_continue }}
        uses: projectbluefin/actions/bootc-build/sign-and-publish@v1
        with:
          image: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}${{ matrix.nvidia_image_suffix }}
          digest: ${{ steps.push.outputs.nvidia_digest }}
          generate-sbom: false
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Write ${{ matrix.nvidia_variant }} digest artifact
        if: (!cancelled()) && steps.sign-nvidia.outcome == 'success'
        env:
          BUILD_SHA: ${{ needs.setup.outputs.sha }}
          VARIANT: ${{ matrix.nvidia_variant }}
          IMAGE: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}${{ matrix.nvidia_image_suffix }}
          DIGEST: ${{ steps.push.outputs.nvidia_digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digest-nvidia"
          jq -n --arg variant "$VARIANT" --arg image "$IMAGE" --arg sha "$BUILD_SHA" \
            --arg digest "$DIGEST" --arg created "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{schema: 1, variant: $variant, image: $image, sha: $sha, digest: $digest, created: $created}' \
            > "${RUNNER_TEMP}/digest-nvidia/digest.json"

      - name: Upload ${{ matrix.nvidia_variant }} digest artifact
        if: (!cancelled()) && steps.sign-nvidia.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.nvidia_variant }}
          path: ${{ runner.temp }}/digest-nvidia/digest.json
          retention-days: 30
          if-no-files-found: error

      # Optional images drop out with a warning instead of failing the job,
      # so list what this job actually published.
      - name: Summarize published images
        if: always()
        env:
          BASE: ${{ env.IMAGE_NAME }}${{ matrix.base_image_suffix }}
          NVIDIA: ${{ env.IMAGE_NAME }}${{ matrix.nvidia_image_suffix }}
          BASE_SIGNED: ${{ steps.sign-base.outcome }}
          NVIDIA_SIGNED: ${{ steps.sign-nvidia.outcome }}
        run: |
          {
            echo "### ${{ matrix.group }} images"
            for row in "$BASE:$BASE_SIGNED" "$NVIDIA:$NVIDIA_SIGNED"; do
              if [ "${row#*:}" = success ]; then echo "- \`${row%%:*}\`: published"
              else echo "- \`${row%%:*}\`: **not published**"; fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Generate and attach SBOM ──────────────────────────────────────────────
  # Runs outside the critical path to :testing. Failures here must not block
  # publish/promotion. Stable release notes consume the sbom-dakota artifact.
  # P3: pip wheel cache keyed to the pinned buildstream-sbom commit SHA so
  # repeated runs skip the GitLab git fetch entirely.
  publish-sbom:
    needs: [setup, publish-image]
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: default
            element: oci/bluefin.bst
            image_suffix: ''
            sbom_filename: dakota.spdx.json
            continue: true
          - variant: nvidia
            element: oci/bluefin-nvidia.bst
            image_suffix: '-nvidia'
            sbom_filename: dakota-nvidia.spdx.json
            continue: true
    continue-on-error: ${{ matrix.continue }}
    permissions:
      contents: read
      packages: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.setup.outputs.sha }}

      - name: Setup runner
        uses: projectbluefin/actions/bootc-build/setup-runner@v1
        with:
          storage-backend: btrfs
          update-podman: true
          native-overlay: true
          install-tools: '["just", "cosign"]'

      # BST config for remote CAS — buildstream-sbom calls bst show --deps all
      # internally which needs element graph resolution via the remote CAS.
      - name: Generate BST fetch config
        env:
          CASD_CLIENT_CERT: ${{ vars.CASD_CLIENT_CERT }}
          CASD_CLIENT_KEY: ${{ secrets.CASD_CLIENT_KEY }}
        uses: ./.github/actions/generate-bst-ci-config
        with:
          enable-remote-execution: 'false'
          enable-push: 'false'

      # Cache the pip wheel for buildstream-sbom across runs.
      # Key is the pinned GitLab commit SHA — auto-invalidates on pin bumps.
      # The wheel lives at ~/.cache/pip on the host; mounted into the bst2
      # container via -v in just sbom so pip finds it without a network fetch.
      - name: Restore pip cache for buildstream-sbom
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/pip
          key: pip-sbom-0706fec3bedf6f73bd9d2fed32c2aed585feef8d
          restore-keys: pip-sbom-

      - name: Generate SBOM
        env:
          BST_FLAGS: --no-interactive --config /src/buildstream-ci.conf
        run: just sbom ${{ matrix.variant }}

      - name: Upload SBOM artifact for release workflow
        if: matrix.variant == 'default'
        run: cp dakota.spdx.json dakota.sbom.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.variant == 'default'
        with:
          name: sbom-dakota
          path: dakota.sbom.json
          retention-days: 30

      - name: Login to GHCR
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ~/.docker
          echo "$GH_TOKEN" | podman login ghcr.io --username "$GH_ACTOR" --password-stdin \
            --compat-auth-file ~/.docker/config.json

      - name: Install oras
        uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3

      - name: Resolve image digest
        id: digest
        uses: ./.github/actions/resolve-image-digest
        with:
          artifact-name: digest-${{ matrix.variant }}
          image: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}${{ matrix.image_suffix }}
          build-sha: ${{ needs.setup.outputs.sha }}
          registry-creds: ${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}
          require-artifact: 'true'

      - name: Attach SBOM
        id: sbom-attach
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          set -o pipefail
          SBOM_DIGEST=$(oras attach \
            --artifact-type application/vnd.spdx+json \
            --format json \
            "${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}${{ matrix.image_suffix }}@${DIGEST}" \
            ${{ matrix.sbom_filename }}:application/vnd.spdx+json \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['digest'])")
          if [[ -z "$SBOM_DIGEST" || "$SBOM_DIGEST" == "None" ]]; then
            echo "ERROR: Failed to capture SBOM digest from oras attach"
            exit 1
          fi
          echo "sbom_digest=${SBOM_DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Sign SBOM
        env:
          SBOM_DIGEST: ${{ steps.sbom-attach.outputs.sbom_digest }}
        run: |
          cosign sign -y \
            "${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}${{ matrix.image_suffix }}@${SBOM_DIGEST}"

  # ── Promote :testing ──────────────────────────────────────────────────────
  # Applies the stream tag to the digest recorded by publish-image.
  # Uses skopeo copy for server-side re-tagging: layers never leave the registry,
  # saving the 20–25 min round-trip of the previous podman pull→tag→push approach.
  # --preserve-digests keeps the promoted tag pointing at the signed manifest digest.
  # NVIDIA is continue-on-error so a failing NVIDIA promote does not
  # prevent the default :testing from landing.
  promote:
    needs: [setup, publish-image]
    if: >-
      needs.publish-image.result == 'success' &&
      needs.setup.outputs.testing_tag != '' &&
      github.event_name == 'workflow_run'
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: default
            image_suffix: ''
            continue: false
          - variant: nvidia
            image_suffix: '-nvidia'
            continue: true
          - variant: gaming
            image_suffix: '-gaming'
            continue: true
          - variant: nvidia-gaming
            image_suffix: '-nvidia-gaming'
            continue: true
    continue-on-error: ${{ matrix.continue }}
    permissions:
      contents: write
      packages: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The digest artifact is written only after signing; never fall back
      # to the :SHA tag, which exists for a pushed image whose signing failed.
      - name: Resolve source digest
        id: digest
        uses: ./.github/actions/resolve-image-digest
        with:
          artifact-name: digest-${{ matrix.variant }}
          image: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}${{ matrix.image_suffix }}
          build-sha: ${{ needs.setup.outputs.sha }}
          registry-creds: ${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}
          require-artifact: 'true'

      - name: Promote :${{ needs.setup.outputs.sha }} to :${{ needs.setup.outputs.testing_tag }}
        env:
          TESTING_TAG: ${{ needs.setup.outputs.testing_tag }}
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          IMAGE="${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}${{ matrix.image_suffix }}"
          PUSH_OK=false
          for attempt in 1 2 3; do
            skopeo copy \
              --preserve-digests \
              --src-creds "$GH_ACTOR:$GH_TOKEN" \
              --dest-creds "$GH_ACTOR:$GH_TOKEN" \
              "docker://${IMAGE}@${DIGEST}" \
              "docker://${IMAGE}:${TESTING_TAG}" && { PUSH_OK=true; break; }
            echo "skopeo copy attempt ${attempt} failed for :${TESTING_TAG}, retrying in 5s..."
            [ "$attempt" -lt 3 ] && sleep 5
          done
          $PUSH_OK || { echo "ERROR: all copy attempts failed for :${TESTING_TAG}"; exit 1; }

          PROMOTED=$(skopeo inspect --no-tags --creds "$GH_ACTOR:$GH_TOKEN" \
            "docker://${IMAGE}:${TESTING_TAG}" | jq -r '.Digest')
          if [ "$PROMOTED" != "$DIGEST" ]; then
            echo "ERROR: :${TESTING_TAG} points at ${PROMOTED}, expected ${DIGEST}"
            exit 1
          fi

      - name: Push :btw alias (next stream only)
        if: needs.setup.outputs.testing_tag == 'next'
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          IMAGE="${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}${{ matrix.image_suffix }}"
          PUSH_OK=false
          for attempt in 1 2 3; do
            skopeo copy \
              --preserve-digests \
              --src-creds "$GH_ACTOR:$GH_TOKEN" \
              --dest-creds "$GH_ACTOR:$GH_TOKEN" \
              "docker://${IMAGE}@${DIGEST}" \
              "docker://${IMAGE}:btw" && { PUSH_OK=true; break; }
            echo "skopeo copy attempt ${attempt} failed for :btw, retrying in 5s..."
            [ "$attempt" -lt 3 ] && sleep 5
          done
          $PUSH_OK || { echo "ERROR: all copy attempts failed for :btw"; exit 1; }

  # ── Verify every image was promoted ──────────────────────────────────────
  # Optional images drop out of publish-image and promote without failing
  # those jobs. Stable releases need all four at one SHA, so fail the run
  # here, next to the cause, instead of at the next stable cut.
  verify-promotion:
    needs: [setup, publish-image, promote]
    if: >-
      !cancelled() &&
      needs.publish-image.result == 'success' &&
      needs.setup.outputs.testing_tag != '' &&
      github.event_name == 'workflow_run'
    runs-on: ubuntu-26.04
    permissions:
      packages: read
    steps:
      - name: Require all four images at this SHA
        env:
          BUILD_SHA: ${{ needs.setup.outputs.sha }}
          TESTING_TAG: ${{ needs.setup.outputs.testing_tag }}
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          digest_of() {
            skopeo inspect --no-tags --creds "$GH_ACTOR:$GH_TOKEN" "docker://$1" 2>/dev/null \
              | jq -r '.Digest // empty' || true
          }
          failed=false
          echo "### :${TESTING_TAG} at ${BUILD_SHA}" >> "$GITHUB_STEP_SUMMARY"
          for suffix in "" -nvidia -gaming -nvidia-gaming; do
            name="${IMAGE_NAME}${suffix}"
            built=$(digest_of "${IMAGE_REGISTRY}/${name}:${BUILD_SHA}")
            promoted=$(digest_of "${IMAGE_REGISTRY}/${name}:${TESTING_TAG}")
            if [ -n "$built" ] && [ "$built" = "$promoted" ]; then
              echo "- \`${name}\`: \`${promoted}\`" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error::${name}:${TESTING_TAG} is not this build (:${BUILD_SHA} '${built:-missing}', :${TESTING_TAG} '${promoted:-missing}')"
              echo "- \`${name}\`: **not promoted**" >> "$GITHUB_STEP_SUMMARY"
              failed=true
            fi
          done
          [ "$failed" = false ]
