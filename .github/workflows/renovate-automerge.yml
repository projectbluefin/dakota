name: Renovate Auto-merge

on:
  workflow_run:
    workflows: ["Build Bluefin dakota"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: github.event.workflow_run.conclusion == 'success'
    uses: projectbluefin/actions/.github/workflows/reusable-renovate-automerge.yml@3f01fd8e8c186b072c21d0453f2dc66c727f9db8 # v1
    with:
      head_sha: ${{ github.event.workflow_run.head_sha }}
