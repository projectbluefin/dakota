name: Renovate Auto-merge

on:
  workflow_run:
    workflows: ["Build Bluefin dakota"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: github.event.workflow_run.conclusion == 'success'
    uses: projectbluefin/actions/.github/workflows/reusable-renovate-automerge.yml@45dc35dd6f6fb0d6fa791352970b02934de31b50 # v1
    with:
      head_sha: ${{ github.event.workflow_run.head_sha }}
