name: Renovate Auto-merge

on:
  workflow_run:
    workflows: ["Build Bluefin dakota"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: github.event.workflow_run.conclusion == 'success'
    uses: projectbluefin/actions/.github/workflows/reusable-renovate-automerge.yml@dfa1d00ac9afad82898c9c69971241dacf34376e # v1
    with:
      head_sha: ${{ github.event.workflow_run.head_sha }}
