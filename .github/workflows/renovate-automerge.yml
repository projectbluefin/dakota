name: Renovate Auto-merge

on:
  workflow_run:
    workflows: ["Build Bluefin dakota"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: github.event.workflow_run.conclusion == 'success'
    uses: projectbluefin/actions/.github/workflows/reusable-renovate-automerge.yml@cbd8446f58a079e48f76d81d5bc1c2fdec95d592 # v1
    with:
      head_sha: ${{ github.event.workflow_run.head_sha }}
