name: Renovate Auto-merge

on:
  workflow_run:
    workflows: ["Build Bluefin dakota"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: github.event.workflow_run.conclusion == 'success'
    uses: projectbluefin/actions/.github/workflows/reusable-renovate-automerge.yml@7827453a52eaddb45cb432bd14d9651bc27669ba # v1
    with:
      head_sha: ${{ github.event.workflow_run.head_sha }}
      base_branch: main
