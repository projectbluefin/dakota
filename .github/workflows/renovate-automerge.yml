name: Renovate Auto-merge

on:
  workflow_run:
    workflows: ["Build Bluefin dakota"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: github.event.workflow_run.conclusion == 'success'
    uses: projectbluefin/actions/.github/workflows/reusable-renovate-automerge.yml@34f00f9304a19ffeab55e30646ad48352c0d3c8b # v1
    with:
      head_sha: ${{ github.event.workflow_run.head_sha }}
