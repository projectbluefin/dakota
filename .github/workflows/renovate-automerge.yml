name: Renovate Auto-merge

on:
  workflow_run:
    workflows: ["Build Bluefin dakota"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: github.event.workflow_run.conclusion == 'success'
    uses: projectbluefin/actions/.github/workflows/reusable-renovate-automerge.yml@e6aaccdffd3a2e7447bcadb9a52bc7ef347dedea # v1
    with:
      head_sha: ${{ github.event.workflow_run.head_sha }}
