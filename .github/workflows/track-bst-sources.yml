name: Track BuildStream Sources

on:
  repository_dispatch:
    types: [common-updated]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      group:
        description: 'What to track'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - bundle
          - core-junctions

permissions: read-all

# Tracking resolves refs and fetches kernel sources to check patch queues,
# but never builds or publishes. Keep it independent of build concurrency.
concurrency:
  group: dakota-source-track
  cancel-in-progress: false

env:
  BST2_IMAGE: registry.gitlab.com/freedesktop-sdk/infrastructure/freedesktop-sdk-docker-images/bst2

# Every non-junction update lands in ONE bundle PR (auto/track-bundle).
# Always run a full tracking pass: a partial pass would drop pending updates.
# Source selection and update logic are shared with `just update-sources`.
# Recording/composition remain separate in .github/scripts/track_bundle.py.
jobs:
  tracking-matrix:
    if: github.event_name != 'workflow_dispatch' || inputs.group != 'core-junctions'
    runs-on: ubuntu-26.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Read shared source list
        id: matrix
        run: |
          matrix=$(python3 scripts/update_sources.py --matrix)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  track:
    needs: tracking-matrix
    if: github.event_name != 'workflow_dispatch' || inputs.group != 'core-junctions'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.tracking-matrix.outputs.matrix) }}
    steps:
      - name: Setup Just
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2
        with:
          tool: just

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Pull BuildStream container image
        run: podman pull "$BST2_IMAGE"

      - name: Track sources with BuildStream
        env:
          ELEMENT: ${{ matrix.element }}
        run: just update-sources --element "$ELEMENT"

      - name: Record update
        id: record
        env:
          ELEMENT: ${{ matrix.element }}
          TITLE: ${{ matrix.title }}
          NOTE: ${{ matrix.note || '' }}
        run: |
          python3 .github/scripts/track_bundle.py record-element \
            --element "$ELEMENT" --title "$TITLE" --note "$NOTE"

      - name: Upload update
        if: steps.record.outputs.slug != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: track-${{ steps.record.outputs.slug }}
          path: ${{ runner.temp }}/tracked
          if-no-files-found: error
          retention-days: 1

  # Release URLs must advance before BuildStream re-pins checksums. The shared
  # updater continues after individual failures and records only successes.
  track-tarballs:
    if: github.event_name != 'workflow_dispatch' || inputs.group != 'core-junctions'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Just
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2
        with:
          tool: just

      - name: Update release assets
        run: just update-sources --group tarballs --record-dir "$RUNNER_TEMP/tracked"

      - name: Upload updates
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: track-tarballs
          path: ${{ runner.temp }}/tracked
          if-no-files-found: ignore
          retention-days: 1

  # ── One bundle PR for every non-junction update ───────────────────────────
  bundle:
    needs: [track, track-tarballs]
    # Runs after partial tracking failures too: the remaining updates still
    # ship, and the failed element rejoins the bundle on the next run.
    if: ${{ !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.group != 'core-junctions') }}
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Get mergeraptor token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.MERGERAPTOR_APP_ID }}
          private-key: ${{ secrets.MERGERAPTOR_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Download tracked updates
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: track-*
          merge-multiple: true
          path: ${{ runner.temp }}/tracked

      - name: Warn about failed tracking
        if: needs.track.result != 'success' || needs.track-tarballs.result != 'success'
        run: |
          echo "::warning::Some elements failed to track (track: ${{ needs.track.result }}, track-tarballs: ${{ needs.track-tarballs.result }}). Their updates are missing from this bundle until a later run succeeds."

      - name: Compose bundle branch and PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          # Space-separated element slugs (file basename without .bst) to hold
          # out of the bundle, e.g. while an upstream regression is fixed.
          SKIP: ${{ vars.TRACK_BUNDLE_SKIP }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 .github/scripts/track_bundle.py compose \
            --tracked "$RUNNER_TEMP/tracked" --branch auto/track-bundle --base testing \
            --skip "$SKIP" --run-url "$RUN_URL"

  # ── Atomic co-tracking of core junctions ──────────────────────────────────
  # freedesktop-sdk.bst overrides reference gnome-build-meta.bst elements directly.
  # Both must land in one commit. No auto-merge — requires human review.
  track-core-junctions:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      pull-requests: write
    if: >-
      github.event.inputs.group == 'all' ||
      github.event.inputs.group == 'core-junctions' ||
      github.event_name == 'schedule'
    steps:
      - name: Get mergeraptor token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.MERGERAPTOR_APP_ID }}
          private-key: ${{ secrets.MERGERAPTOR_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Just
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2
        with:
          tool: just

      - name: Pull BuildStream container image
        run: podman pull "$BST2_IMAGE"

      - name: Track gnome-build-meta, derive freedesktop-sdk from its pin
        run: just update-sources --group core-junctions

      - name: Create or update PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -B auto/track-core-junctions origin/testing
          # patch-sync adds and removes files, so stage first and test the index.
          git add elements/gnome-build-meta.bst elements/freedesktop-sdk.bst patches/freedesktop-sdk patches/freedesktop-sdk.manifest.json
          git diff --cached --quiet && { echo "No junction updates"; exit 0; }
          git commit -m "chore(deps): update core junctions (gnome-build-meta + freedesktop-sdk)"
          git push --force-with-lease origin auto/track-core-junctions

          EXISTING=$(gh pr list --head auto/track-core-junctions --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$EXISTING" ]; then
            PR_URL=$(gh pr view "$EXISTING" --json url --jq '.url')
            echo "Existing PR: $PR_URL"
          else
            PR_URL=$(gh pr create \
              --base testing \
              --head auto/track-core-junctions \
              --title "chore(deps): update core junctions (gnome-build-meta + freedesktop-sdk)" \
              --body "Updates \`gnome-build-meta.bst\`, derives the \`freedesktop-sdk.bst\` pin from it, and re-syncs \`patches/freedesktop-sdk\`. Manual review required — junction bumps can break downstream elements.")
            echo "PR: $PR_URL"
          fi
