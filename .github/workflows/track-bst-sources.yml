name: Track BuildStream Sources

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      group:
        description: 'Which element group to track'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - auto-merge
          - manual-merge
          - tarballs

permissions:
  contents: write
  pull-requests: write

env:
  BST2_IMAGE: registry.gitlab.com/freedesktop-sdk/infrastructure/freedesktop-sdk-docker-images/bst2:f89b4aef847ef040b345acceda15a850219eb8f1

jobs:
  track:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── auto-merge: Bluefin packages ──
          - group: auto-merge
            element: bluefin/brew.bst
            branch: auto/track-brew
            title: "chore(deps): update brew"
          - group: auto-merge
            element: bluefin/common.bst
            branch: auto/track-common
            title: "chore(deps): update common"
          - group: auto-merge
            element: bluefin/jetbrains-mono.bst
            branch: auto/track-jetbrains-mono
            title: "chore(deps): update jetbrains-mono"
          - group: auto-merge
            element: bluefin/shell-extensions/app-indicators.bst
            branch: auto/track-app-indicators
            title: "chore(deps): update app-indicators extension"
          - group: auto-merge
            element: bluefin/shell-extensions/blur-my-shell.bst
            branch: auto/track-blur-my-shell
            title: "chore(deps): update blur-my-shell extension"
          - group: auto-merge
            element: bluefin/shell-extensions/dash-to-dock.bst
            branch: auto/track-dash-to-dock
            title: "chore(deps): update dash-to-dock extension"
          - group: auto-merge
            element: bluefin/shell-extensions/gsconnect.bst
            branch: auto/track-gsconnect
            title: "chore(deps): update gsconnect extension"
          - group: auto-merge
            element: bluefin/shell-extensions/search-light.bst
            branch: auto/track-search-light
            title: "chore(deps): update search-light extension"
          - group: auto-merge
            element: bluefin/shell-extensions/logomenu.bst
            branch: auto/track-logomenu
            title: "chore(deps): update logomenu extension"
          # ── manual-merge: core junctions ──
          - group: manual-merge
            element: gnome-build-meta.bst
            branch: auto/track-gnome-build-meta
            title: "chore(deps): update gnome-build-meta junction"
          - group: manual-merge
            element: freedesktop-sdk.bst
            branch: auto/track-freedesktop-sdk
            title: "chore(deps): update freedesktop-sdk junction"

    steps:
      - name: Should this group run?
        id: gate
        run: |
          GROUP="${{ github.event.inputs.group || 'all' }}"
          if [ "$GROUP" = "all" ] || [ "$GROUP" = "${{ matrix.group }}" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Checkout repository
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull BuildStream container image
        if: steps.gate.outputs.run == 'true'
        run: podman pull "$BST2_IMAGE"

      - name: Track sources with BuildStream
        if: steps.gate.outputs.run == 'true'
        run: |
          just bst --no-interactive source track "${{ matrix.element }}"

      - name: Check for changes
        if: steps.gate.outputs.run == 'true'
        id: changes
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No changes detected for ${{ matrix.element }}"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected:"
            git diff --stat
          fi

      - name: Create PR
        if: steps.gate.outputs.run == 'true' && steps.changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ matrix.branch }}"
          TITLE="${{ matrix.title }}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -B "$BRANCH"
          git add elements/
          git commit -m "$TITLE"
          git push --force origin "$BRANCH"

          EXISTING_PR=$(gh pr list --head "$BRANCH" --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$EXISTING_PR" ]; then
            echo "Closing existing PR #$EXISTING_PR"
            gh pr close "$EXISTING_PR" --delete-branch=false || true
          fi

          BODY="Automated update via \`bst source track\` for \`${{ matrix.element }}\`.

          Updates the element ref to the latest commit matching its configured \`track:\` pattern.

          ---
          *Generated by [Track BuildStream Sources](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})*"

          PR_URL=$(gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "$TITLE" \
            --body "$BODY")

          echo "Created PR: $PR_URL"

          if [ "${{ matrix.group }}" = "auto-merge" ]; then
            echo "Enabling auto-merge..."
            gh pr merge "$PR_URL" --auto --squash || echo "::warning::Could not enable auto-merge"
          fi

  track-tarballs:
    runs-on: ubuntu-24.04
    if: >-
      github.event.inputs.group == 'all' ||
      github.event.inputs.group == 'tarballs' ||
      github.event_name == 'schedule'
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update brew-tarball
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BREW_RELEASE=$(gh api repos/ublue-os/packages/releases \
            --jq '[.[] | select(.tag_name | startswith("homebrew-"))][0].tag_name')
          echo "Latest brew release: $BREW_RELEASE"

          BST_FILE="elements/bluefin/brew-tarball.bst"
          CURRENT_TAG=$(grep -oP 'download/\K[^/]+' "$BST_FILE" | head -1)
          echo "Current tag: $CURRENT_TAG"

          if [ "$BREW_RELEASE" = "$CURRENT_TAG" ]; then
            echo "brew-tarball is already up to date."
            exit 0
          fi

          echo "Updating: $CURRENT_TAG -> $BREW_RELEASE"
          sed -i "s|download/${CURRENT_TAG}/|download/${BREW_RELEASE}/|g" "$BST_FILE"
          just bst -o arch x86_64 source track bluefin/brew-tarball.bst
          just bst -o arch aarch64 source track bluefin/brew-tarball.bst

          BRANCH="auto/track-brew-tarball"
          TITLE="chore(deps): update brew-tarball to ${BREW_RELEASE}"

          git checkout -B "$BRANCH"
          git add "$BST_FILE"
          git commit -m "$TITLE"
          git push --force origin "$BRANCH"
          git checkout main

          EXISTING_PR=$(gh pr list --head "$BRANCH" --json number --jq '.[0].number' 2>/dev/null || true)
          [ -n "$EXISTING_PR" ] && gh pr close "$EXISTING_PR" --delete-branch=false || true

          BODY="Automated update for \`brew-tarball\` from \`${CURRENT_TAG}\` to \`${BREW_RELEASE}\`.

          ---
          *Generated by [Track BuildStream Sources](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})*"

          PR_URL=$(gh pr create --base main --head "$BRANCH" --title "$TITLE" --body "$BODY")
          echo "Created PR: $PR_URL"
          gh pr merge "$PR_URL" --auto --squash || echo "::warning::Could not enable auto-merge"

      - name: Update wallpapers
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          WALL_RELEASE=$(gh api repos/ublue-os/artwork/releases \
            --jq '[.[] | select(.tag_name | startswith("bluefin-"))][0].tag_name')
          echo "Latest wallpaper release: $WALL_RELEASE"

          BST_FILE="elements/bluefin/wallpapers.bst"
          CURRENT_TAG=$(grep -oP 'download/\K[^/]+' "$BST_FILE")
          echo "Current tag: $CURRENT_TAG"

          if [ "$WALL_RELEASE" = "$CURRENT_TAG" ]; then
            echo "wallpapers is already up to date."
            exit 0
          fi

          echo "Updating: $CURRENT_TAG -> $WALL_RELEASE"
          sed -i "s|download/${CURRENT_TAG}/|download/${WALL_RELEASE}/|" "$BST_FILE"
          just bst -o arch x86_64 source track bluefin/wallpapers.bst

          BRANCH="auto/track-wallpapers"
          TITLE="chore(deps): update wallpapers to ${WALL_RELEASE}"

          git checkout -B "$BRANCH"
          git add "$BST_FILE"
          git commit -m "$TITLE"
          git push --force origin "$BRANCH"
          git checkout main

          EXISTING_PR=$(gh pr list --head "$BRANCH" --json number --jq '.[0].number' 2>/dev/null || true)
          [ -n "$EXISTING_PR" ] && gh pr close "$EXISTING_PR" --delete-branch=false || true

          BODY="Automated update for \`wallpapers\` from \`${CURRENT_TAG}\` to \`${WALL_RELEASE}\`.

          ---
          *Generated by [Track BuildStream Sources](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})*"

          PR_URL=$(gh pr create --base main --head "$BRANCH" --title "$TITLE" --body "$BODY")
          echo "Created PR: $PR_URL"
          gh pr merge "$PR_URL" --auto --squash || echo "::warning::Could not enable auto-merge"

      - name: Update 1password-cli
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ONEPASSWORD_PACKAGES=$(curl -fsL "https://downloads.1password.com/linux/debian/amd64/dists/stable/main/binary-amd64/Packages")
          CLI_VERSION=$(echo "$ONEPASSWORD_PACKAGES" | grep -A5 "^Package: 1password-cli$" | grep "^Version:" | head -1 | awk '{print $2}' | sed 's/-[0-9]*$//')
          echo "Latest CLI version: $CLI_VERSION"

          CURRENT_CLI_VERSION=$(grep -oP 'v\K[0-9.]+(?=/)' elements/bluefin/1password-cli.bst | head -1)
          echo "Current CLI version: $CURRENT_CLI_VERSION"

          if [ -z "$CLI_VERSION" ] || [ "$CLI_VERSION" = "$CURRENT_CLI_VERSION" ]; then
            echo "1password-cli is already up to date or version not detected."
            exit 0
          fi

          echo "Updating: $CURRENT_CLI_VERSION -> $CLI_VERSION"
          sed -i "s|v${CURRENT_CLI_VERSION}|v${CLI_VERSION}|g" elements/bluefin/1password-cli.bst
          just bst -o arch x86_64 source track bluefin/1password-cli.bst
          just bst -o arch aarch64 source track bluefin/1password-cli.bst

          BRANCH="auto/track-1password-cli"
          TITLE="chore(deps): update 1password-cli to v${CLI_VERSION}"

          git checkout -B "$BRANCH"
          git add elements/bluefin/1password-cli.bst
          git commit -m "$TITLE"
          git push --force origin "$BRANCH"
          git checkout main

          EXISTING_PR=$(gh pr list --head "$BRANCH" --json number --jq '.[0].number' 2>/dev/null || true)
          [ -n "$EXISTING_PR" ] && gh pr close "$EXISTING_PR" --delete-branch=false || true

          BODY="Automated update for \`1password-cli\` from \`v${CURRENT_CLI_VERSION}\` to \`v${CLI_VERSION}\`.

          ---
          *Generated by [Track BuildStream Sources](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})*"

          PR_URL=$(gh pr create --base main --head "$BRANCH" --title "$TITLE" --body "$BODY")
          echo "Created PR: $PR_URL"
          gh pr merge "$PR_URL" --auto --squash || echo "::warning::Could not enable auto-merge"

      - name: Update 1password desktop
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ONEPASSWORD_PACKAGES=$(curl -fsL "https://downloads.1password.com/linux/debian/amd64/dists/stable/main/binary-amd64/Packages")
          DESKTOP_VERSION=$(echo "$ONEPASSWORD_PACKAGES" | grep -A10 "^Package: 1password$" | grep "^Version:" | head -1 | awk '{print $2}')
          echo "Latest desktop version: $DESKTOP_VERSION"

          CURRENT_DESKTOP_VERSION=$(grep -oP '1password-\K[0-9.]+(?=\.x64)' elements/bluefin/1password.bst | head -1)
          echo "Current desktop version: $CURRENT_DESKTOP_VERSION"

          if [ -z "$DESKTOP_VERSION" ] || [ "$DESKTOP_VERSION" = "$CURRENT_DESKTOP_VERSION" ]; then
            echo "1password desktop is already up to date or version not detected."
            exit 0
          fi

          echo "Updating: $CURRENT_DESKTOP_VERSION -> $DESKTOP_VERSION"
          sed -i "s|1password-${CURRENT_DESKTOP_VERSION}\.x64|1password-${DESKTOP_VERSION}.x64|g" elements/bluefin/1password.bst
          sed -i "s|1password-${CURRENT_DESKTOP_VERSION}\.arm64|1password-${DESKTOP_VERSION}.arm64|g" elements/bluefin/1password.bst
          just bst -o arch x86_64 source track bluefin/1password.bst
          just bst -o arch aarch64 source track bluefin/1password.bst

          BRANCH="auto/track-1password"
          TITLE="chore(deps): update 1password to ${DESKTOP_VERSION}"

          git checkout -B "$BRANCH"
          git add elements/bluefin/1password.bst
          git commit -m "$TITLE"
          git push --force origin "$BRANCH"
          git checkout main

          EXISTING_PR=$(gh pr list --head "$BRANCH" --json number --jq '.[0].number' 2>/dev/null || true)
          [ -n "$EXISTING_PR" ] && gh pr close "$EXISTING_PR" --delete-branch=false || true

          BODY="Automated update for \`1password\` from \`${CURRENT_DESKTOP_VERSION}\` to \`${DESKTOP_VERSION}\`.

          ---
          *Generated by [Track BuildStream Sources](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})*"

          PR_URL=$(gh pr create --base main --head "$BRANCH" --title "$TITLE" --body "$BODY")
          echo "Created PR: $PR_URL"
          gh pr merge "$PR_URL" --auto --squash || echo "::warning::Could not enable auto-merge"
