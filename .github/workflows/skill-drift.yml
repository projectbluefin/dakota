name: Skill Drift

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  skill-drift:
    uses: projectbluefin/actions/.github/workflows/skill-drift-check.yml@3f01fd8e8c186b072c21d0453f2dc66c727f9db8 # v1
    with:
      code-paths: '[".github/workflows/**", "build_files/**", "Justfile", "elements/**"]'
      skill-paths: '["docs/skills/**", "docs/*.md", "AGENTS.md"]'
