name: Skill Drift

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  skill-drift:
    uses: projectbluefin/actions/.github/workflows/skill-drift-check.yml@45dc35dd6f6fb0d6fa791352970b02934de31b50 # v1
    with:
      code-paths: '[".github/workflows/**", "build_files/**", "Justfile", "elements/**"]'
      skill-paths: '["docs/skills/**", "docs/*.md", "AGENTS.md"]'
