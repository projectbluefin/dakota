name: Skill Drift

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  skill-drift:
    uses: projectbluefin/actions/.github/workflows/skill-drift-check.yml@34f00f9304a19ffeab55e30646ad48352c0d3c8b # v1
    with:
      code-paths: '[".github/workflows/**", "build_files/**", "Justfile", "elements/**"]'
      skill-paths: '["docs/skills/**", "docs/*.md", "AGENTS.md"]'
