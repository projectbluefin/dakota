name: Track next branch junctions and kernels

# Runs at 20:00 UTC daily — offset from the main tracker (06:00 UTC) to avoid
# saturating runners when stable-branch builds are active. gnome-build-meta's
# GBM master CI publishes artifacts well before this, so bump PRs land with the
# upstream CAS already warm.
on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:

# Shares a group with sync-next.yml so a tracker run can never
# interleave with a sync rewriting next. Runner saturation against stable
# builds is handled by the 20:00 UTC schedule offset, not this group.
concurrency:
  group: dakota-next-branch-mutation
  cancel-in-progress: false

env:
  BST2_IMAGE: registry.gitlab.com/freedesktop-sdk/infrastructure/freedesktop-sdk-docker-images/bst2

jobs:
  # ── Track core junctions for next (btw stream) ─────────────────
  # Tracks gnome-build-meta.bst along its branch (track: master in the
  # element), then derives freedesktop-sdk.bst and patches/freedesktop-sdk
  # from the tracked commit: our fdsdk pin and patch queue must match what
  # gnome-build-meta itself uses, or the patch queue stops applying and
  # cache reuse against GNOME's CAS is lost. Tracking fdsdk independently
  # races ahead of gnome-build-meta whenever fdsdk tags a release (see the
  # 26.08beta.4 failure on 2026-08-17).
  #
  # Kernels are next-owned too: track their configured patterns in the same PR.
  # Junction-only PRs retain auto-merge. Kernel changes require human review
  # and successful kernel/NVIDIA builds; the general build matrix permits
  # optional-variant failures, so its aggregate status alone is insufficient.
  track-core-junctions-next:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Get mergeraptor token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.MERGERAPTOR_APP_ID }}
          private-key: ${{ secrets.MERGERAPTOR_PRIVATE_KEY }}

      - name: Checkout next branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: next
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Just
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2
        with:
          tool: just

      - name: Pull BuildStream container image
        run: podman pull "$BST2_IMAGE"

      - name: Track gnome-build-meta, derive freedesktop-sdk from its pin
        run: just update-sources --group core-junctions

      - name: Track next-owned kernels
        run: just update-sources --group kernels

      - name: Create or update PR against next
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -B auto/track-next-junction origin/next
          git add elements/gnome-build-meta.bst elements/freedesktop-sdk.bst patches/freedesktop-sdk patches/freedesktop-sdk.manifest.json \
            elements/core/linux-fdsdk.bst elements/core/linux-ogc.bst

          if git diff --cached --quiet; then
            echo "No junction or kernel updates"
            # A leftover open PR at this point predates the current junction
            # state (e.g. an unmergeable bump) — close it rather than let it
            # linger with auto-merge armed.
            EXISTING=$(gh pr list --head auto/track-next-junction --base next --state open --json number --jq '.[0].number // empty' || true)
            if [ -n "$EXISTING" ]; then
              gh pr close "$EXISTING" --delete-branch \
                --comment "Superseded: next already matches the tracked junction state."
            fi
            exit 0
          fi

          KERNEL_UPDATES=false
          git diff --cached --quiet -- elements/core/linux-fdsdk.bst elements/core/linux-ogc.bst || KERNEL_UPDATES=true
          EXISTING=$(gh pr list --head auto/track-next-junction --base next --state open --json number --jq '.[0].number // empty')
          # Disable an existing auto-merge BEFORE pushing a kernel update.
          # API failures must stop the job rather than publish with auto-merge armed.
          if [ "$KERNEL_UPDATES" = true ] && [ -n "$EXISTING" ]; then
            AUTO_MERGE=$(gh pr view "$EXISTING" --json autoMergeRequest --jq '.autoMergeRequest != null')
            if [ "$AUTO_MERGE" = true ]; then
              gh pr merge "$EXISTING" --disable-auto
            elif [ "$AUTO_MERGE" != false ]; then
              echo "ERROR: could not determine existing PR auto-merge state" >&2
              exit 1
            fi
          fi

          git commit -m "chore(deps): update next junctions and kernels"
          git push --force-with-lease origin auto/track-next-junction

          if [ -n "$EXISTING" ]; then
            PR_URL=$(gh pr view "$EXISTING" --json url --jq '.url')
            echo "Existing PR: $PR_URL"
          else
            PR_URL=$(gh pr create \
              --base next \
              --head auto/track-next-junction \
              --title "chore(deps): update next junctions and kernels" \
              --body "Tracks GBM along master, derives its matching FDSDK pin and patches, and tracks next's configured kernel series. Kernel updates require patch review and successful kernel/NVIDIA builds before human approval. Only junction-only updates enable auto-merge.")
            echo "Created PR: $PR_URL"
          fi

          if [ "$KERNEL_UPDATES" = true ]; then
            echo "Kernel changes: leaving auto-merge disabled for patch review and kernel/NVIDIA build validation."
          else
            # Preserve the existing auto-merge policy for junction-only changes.
            gh pr merge "$PR_URL" --auto --squash
          fi
