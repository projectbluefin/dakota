name: PR cleanup

# Delete the :pr-N image tags and live ISOs build.yml pushed once the PR closes.
on:
  pull_request:
    types: [closed]

permissions:
  packages: write

jobs:
  delete-pr-tags:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Delete :pr-N tags from GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          PR_TAG: pr-${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          for PACKAGE in dakota dakota-nvidia dakota-gaming dakota-nvidia-gaming; do
            # Only versions tagged solely :pr-N; never a version that also
            # carries a stream or SHA tag.
            IDS=$(gh api "/orgs/${OWNER}/packages/container/${PACKAGE}/versions" --paginate \
              --jq ".[] | select(.metadata.container.tags == [\"${PR_TAG}\"]) | .id")
            if [ -z "$IDS" ]; then
              echo "${PACKAGE}:${PR_TAG} not found; nothing to delete"
              continue
            fi
            for ID in $IDS; do
              echo "Deleting ${PACKAGE} version ${ID} (${PR_TAG})"
              gh api --method DELETE "/orgs/${OWNER}/packages/container/${PACKAGE}/versions/${ID}"
            done
          done

  # build.yml uploads <image>-pr-N.iso when a PR changes the live ISO.
  delete-pr-isos:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # The base branch's copy of the script, never the closed PR's.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.ref }}

      - name: Delete the PR's live ISOs from R2
        env:
          PR_TAG: pr-${{ github.event.pull_request.number }}
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: python3 scripts/pr_test.py delete-isos --tag "$PR_TAG" --images dakota dakota-nvidia
