name: Generate BuildStream CI config
description: Write BuildStream CI config for remote builds and local artifact consumers.

inputs:
  enable-remote-execution:
    description: Route build actions and CAS storage through cache.projectbluefin.io.
    required: true
  enable-push:
    description: Publish built artifacts and fetched sources during the BuildStream build.
    required: false
    default: 'true'
  casd-socket:
    description: >-
      casd's unix socket on build-pool runners that sit on the cache server.
      Used instead of the mTLS endpoint only when it exists and the job has
      both remote execution and pushes enabled, so signing jobs (push off)
      never reach it.
    required: false
    default: /run/casd/casd.sock

runs:
  using: composite
  steps:
    - name: Generate BuildStream CI config
      shell: bash
      env:
        ENABLE_REMOTE_EXECUTION: ${{ inputs.enable-remote-execution }}
        ENABLE_PUSH: ${{ inputs.enable-push }}
        CASD_SOCKET: ${{ inputs.casd-socket }}
      run: |
        set -euo pipefail
        WORKSPACE_ROOT="${GITHUB_WORKSPACE:-$PWD}"
        mkdir -p "$WORKSPACE_ROOT/logs"

        # A unix: remote is a plaintext gRPC channel with no TLS or client
        # identity (buildbox-common's ConnectionOptions accepts http://,
        # https://, grpc://, grpcs:// and unix:), and the socket grants full
        # read-write access to the production CAS. Only build-pool jobs with
        # remote execution and pushes on may use it; everything else keeps
        # the mTLS endpoint.
        USE_SOCKET=false
        if [[ "${ENABLE_REMOTE_EXECUTION:-false}" == "true" ]] &&
           [[ "${ENABLE_PUSH:-true}" == "true" ]] &&
           [[ -n "${CASD_SOCKET:-}" ]] && [[ -S "$CASD_SOCKET" ]]; then
          USE_SOCKET=true
        fi

        if [[ "$USE_SOCKET" == "false" ]] &&
           [[ "${ENABLE_REMOTE_EXECUTION:-false}" == "true" ]] &&
           { [[ -z "${CASD_CLIENT_CERT:-}" ]] || [[ -z "${CASD_CLIENT_KEY:-}" ]]; }; then
          echo "::error::remote execution was requested but CASD client credentials are missing"
          exit 1
        fi

        printf '%s\n' "${CASD_CLIENT_CERT:-}" > "$WORKSPACE_ROOT/client.crt"
        printf '%s\n' "${CASD_CLIENT_KEY:-}" > "$WORKSPACE_ROOT/client.key"
        chmod 0600 "$WORKSPACE_ROOT/client.crt" "$WORKSPACE_ROOT/client.key"

        # Every remote service entry shares one endpoint tuning and mTLS
        # identity; the stanzas expand inside the unquoted heredocs below.
        CONNECTION_CONFIG=$(cat <<'EOF'
            connection-config:
              keepalive-time: 180
              retry-limit: 5
              retry-delay: 1000
              request-timeout: 180
        EOF
        )
        CLIENT_AUTH=$(cat <<'EOF'
            auth:
              client-key: /src/client.key
              client-cert: /src/client.crt
        EOF
        )

        # Dakota's own CAS: the socket on build-pool runners, mTLS otherwise.
        # just bst runs BuildStream in a container, so the socket directory is
        # mounted into it through BST_PODMAN_EXTRA_ARGS.
        if [[ "$USE_SOCKET" == "true" ]]; then
          CAS_URL="unix:${CASD_SOCKET}"
          CAS_AUTH=""
          # Over the socket, keepalive pings reach casd itself rather than
          # Traefik. casd sets no --permit-keepalive-time, so gRPC's server
          # default applies: pings under five minutes apart are strikes and
          # the second closes the connection (too_many_pings), which kills
          # long Execute streams around twelve minutes in.
          CONNECTION_CONFIG="${CONNECTION_CONFIG/keepalive-time: 180/keepalive-time: 360}"
          SOCKET_DIR="$(dirname "$CASD_SOCKET")"
          if [[ -n "${GITHUB_ENV:-}" ]]; then
            echo "BST_PODMAN_EXTRA_ARGS=${BST_PODMAN_EXTRA_ARGS:-} -v ${SOCKET_DIR}:${SOCKET_DIR}:rw" >> "$GITHUB_ENV"
          fi
          echo "Dakota CAS transport: unix socket ${CASD_SOCKET}"
        else
          CAS_URL="https://cache.projectbluefin.io:11002"
          CAS_AUTH="$CLIENT_AUTH"
          echo "Dakota CAS transport: mTLS"
        fi

        # GBM uses four parent element builds, leaving executor slots for
        # nested recc compiles. Our two concurrent matrix jobs share one host,
        # so each gets two builders. Keep max-jobs explicit: the coordinator
        # VM's CPU count does not describe the 32-thread execution host.
        # The GNOME patch queue keeps LocalCAS on and job-token release off,
        # otherwise max-jobs would not bound outstanding recc requests.
        # Signing stays local with one job per element and two builders.
        if [[ "${ENABLE_REMOTE_EXECUTION:-false}" == "true" ]]; then
          MAX_JOBS=8
          BUILDERS=2
        else
          MAX_JOBS=1
          BUILDERS=2
        fi

        cat > "$WORKSPACE_ROOT/buildstream-ci.conf" <<BSTCONF
        scheduler:
          on-error: continue
          fetchers: 32
          builders: ${BUILDERS}
          network-retries: 3

        logging:
          message-format: '[%{wallclock}][%{elapsed}][%{key}][%{element}] %{action} %{message}'
          error-lines: 80

        cachedir: /root/.cache/buildstream
        logdir: /src/logs
        BSTCONF

        cat >> "$WORKSPACE_ROOT/buildstream-ci.conf" <<BSTCONFBUILD
        build:
          retry-failed: True
          max-jobs: ${MAX_JOBS}
        BSTCONFBUILD

        if [[ "$USE_SOCKET" == "true" ]] ||
           { [[ -n "${CASD_CLIENT_CERT:-}" ]] && [[ -n "${CASD_CLIENT_KEY:-}" ]]; }; then
          PUSH_FLAG="true"
          [[ "${ENABLE_PUSH:-true}" == "false" ]] && PUSH_FLAG="false"
          cat >> "$WORKSPACE_ROOT/buildstream-ci.conf" <<BSTCONFCACHE
        artifacts:
          servers:
          - url: ${CAS_URL}
            push: ${PUSH_FLAG}
        ${CONNECTION_CONFIG}
        ${CAS_AUTH}
          - url: https://gbm.gnome.org:11003
            push: false
        ${CONNECTION_CONFIG}
          - url: https://cache.freedesktop-sdk.io:11001
            push: false
        ${CONNECTION_CONFIG}

        source-caches:
          servers:
          - url: ${CAS_URL}
            push: ${PUSH_FLAG}
        ${CONNECTION_CONFIG}
        ${CAS_AUTH}
          - url: https://gbm.gnome.org:11003
            push: false
        ${CONNECTION_CONFIG}
          - url: https://cache.freedesktop-sdk.io:11001
            push: false
        ${CONNECTION_CONFIG}
        BSTCONFCACHE
        fi

        cat >> "$WORKSPACE_ROOT/buildstream-ci.conf" <<'BSTCONFCACHEBLOCK'

        cache:
          cache-buildtrees: never
        BSTCONFCACHEBLOCK

        if [[ "${ENABLE_REMOTE_EXECUTION:-false}" == "true" ]]; then
          # Like GBM, let RE inherit cache.storage-service instead of defining
          # a separate RE storage service. The runner's local casd is a proxy
          # and artifact payloads stay on the BuildBox host until needed.
          # Keep this out of fetch-only publish configs: export must materialize
          # the final artifact on the runner.
          cat >> "$WORKSPACE_ROOT/buildstream-ci.conf" <<BSTCONFREMOTE
          storage-service:
            url: ${CAS_URL}
        ${CONNECTION_CONFIG}
        ${CAS_AUTH}

        remote-execution:
          execution-service:
            url: ${CAS_URL}
        ${CONNECTION_CONFIG}
        ${CAS_AUTH}
          action-cache-service:
            url: ${CAS_URL}
            push: true
        ${CONNECTION_CONFIG}
        ${CAS_AUTH}
        BSTCONFREMOTE
          echo "Remote execution enabled: yes"
        else
          echo "Remote execution enabled: no"
        fi

        cp "$WORKSPACE_ROOT/buildstream-ci.conf" "$WORKSPACE_ROOT/logs/buildstream-ci.conf"
        echo "=== BuildStream CI config ==="
        cat "$WORKSPACE_ROOT/buildstream-ci.conf"
